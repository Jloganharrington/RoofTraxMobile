      summary: Open the Evidence Portal for a share code
      description: >-
        Public (no session). The share code is the capability. Returns the
        inspection summary, evidence photos with fresh short-lived signed
        URLs, and the list of Proof Package versions. Photos marked
        archive-only and all agreement/FIPSA content are excluded.
      security: []
      parameters:
        - name: accessCode
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Portal payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalEnvelope"
        "404":
          description: Unknown or revoked share code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many attempts from this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /portal/{accessCode}/reports/{versionIndex}:
    get:
      operationId: getPortalReportHtml
      tags: [Portal]
      summary: Fetch a Proof Package version as rendered HTML
      description: >-
        Public (no session). Renders the requested compiled Proof Package
        version with freshly signed photo URLs. Blocked-content versions are
        not served.
      security: []
      parameters:
        - name: accessCode
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: versionIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Rendered report HTML.
          content:
