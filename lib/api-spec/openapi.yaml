    # ---------------------------------------------------------------------------
    # Profitability — step 4 / migration 029 (FINANCIALS STEP 5, Step 2)
    # projectedMarginPct removed (Step 2d); replaced by netProjectMarginPct.
    # ---------------------------------------------------------------------------
    ProfitabilitySummary:
      type: object
      required:
        - pinId
        - totalPaymentsCents
        - invoiceTotalCents
        - invoicePaidCents
        - totalExpenseCents
        - paidExpenseCents
        - outstandingExpenseCents
        - leadAcquisitionCostCents
        - referralFeeCents
        - salesCommissionCents
        - pmCommissionCents
        - canvassingCommissionCents
        - totalCommissionCents
        - totalCostCents
        - netProfitCents
        - expectedTotalCents
        - cashMarginPct
        - approvedCoCents
        - revisedContractCents
        - netProjectMarginCents
        - netProjectMarginPct
        - deductibleCollectedCents
        - policyDeductibleCents
        - approvedAcvCents
        - supplementCandidateCents
        - depreciationCents
        - claimVarianceCents
        - baseScopeCents
      properties:
        pinId:
          type: string
        totalPaymentsCents:
          type: integer
          description: Sum of all payment ledger entries.
        invoiceTotalCents:
          type: integer
          description: Sum of non-void customer invoice amounts.
        invoicePaidCents:
          type: integer
          description: Sum of paid customer invoice amounts.
        totalExpenseCents:
          type: integer
          description: Sum of all vendor expense amounts.
        paidExpenseCents:
          type: integer
          description: Sum of paid vendor expense amounts.
        outstandingExpenseCents:
          type: integer
          description: Sum of unpaid vendor expense amounts.
        leadAcquisitionCostCents:
          type: integer
        referralFeeCents:
          type: integer
        salesCommissionCents:
          type: integer
        pmCommissionCents:
          type: integer
        canvassingCommissionCents:
          type: integer
        totalCommissionCents:
          type: integer
          description: Sum of all five commission/overhead lines (incl. canvassing).
        totalCostCents:
          type: integer
          description: totalExpenseCents + totalCommissionCents.
        netProfitCents:
          type: integer
          description: totalPaymentsCents − totalCostCents (cash basis).
        expectedTotalCents:
          type: integer
          description: >-
            Expected revenue baseline. Insurance: GREATEST(revisedContractCents,
            approvedRcvAmountCents). Retail: revisedContractCents. Uses the
            revised contract as the baseline so a CO that raises the contract
            also raises the projected revenue.
        cashMarginPct:
          type: number
          description: >-
            (totalPaymentsCents − totalCostCents) / totalPaymentsCents × 100.
            Returns 0 (not NaN or null) when totalPaymentsCents = 0.
        approvedCoCents:
          type: integer
          description: Sum of non-voided approved change-order amounts.
        revisedContractCents:
          type: integer
          description: >-
            base contract + approvedCoCents. Accrual-basis contract value after
            all approved (non-voided) change orders.
        netProjectMarginCents:
          type: integer
          description: revisedContractCents − totalCostCents.
        netProjectMarginPct:
          type: number
          description: >-
            netProjectMarginCents / revisedContractCents × 100. Returns 0 (not
            NaN or null) when revisedContractCents = 0. Primary margin metric;
            replaces projectedMarginPct.
        deductibleCollectedCents:
          type: integer
          description: >-
            Sum of payments with type='deductible'. How much of the deductible
            has actually been collected from the homeowner.
        policyDeductibleCents:
          type: integer
          description: >-
            Policy deductible amount parsed from the legacy varchar
            deductibleAmount field.
        approvedAcvCents:
          type: integer
          description: >-
            Approved ACV parsed from the legacy varchar approvedAcvAmount
            field.
        supplementCandidateCents:
          type: integer
          description: >-
            Sum of approved non-voided change orders flagged as
            requiredToCompleteScope. Shows the dollar value of supplementable
            items already on file.
        depreciationCents:
          type: integer
          description: approvedRcvCents − approvedAcvCents.
        claimVarianceCents:
          type: integer
          description: >-
            approvedRcvCents − revisedContractCents. Negative = SHORT
            (carrier approved less than the contract; a supplement may be
            needed to bridge the gap).
        baseScopeCents:
          type: integer
          description: >-
            revisedContractCents − bettermentsAmountCents. What the carrier
            owes after stripping out betterments.
    ProfitabilitySummaryEnvelope:
      type: object
      required: [profitability]
      properties:
        profitability:
          $ref: "#/components/schemas/ProfitabilitySummary"

