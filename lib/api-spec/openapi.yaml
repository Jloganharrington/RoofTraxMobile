        extendedDeltaCents:  { type: integer }
        selectedBy:          { type: string }
        selectedAt:          { type: string, format: date-time }

    ContractScopePackage:
      type: object
      required: [id, categoryId, categoryName, quantity, unit, coveredAmountCents, sortOrder]
      properties:
        id:                  { type: string }
        categoryId:          { type: string }
        categoryName:        { type: string }
        quantity:            { type: string }
        unit:                { type: string }
        coveredAmountCents:  { type: integer }
        sortOrder:           { type: integer }
        selection:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ContractSelection"

    Contract:
      type: object
      required: [id, companyId, pinId, status, coveredScopeCents, bettermentsCents, deductibleCents, totalContractCents, createdByUserId, createdAt, updatedAt, scopePackages]
      properties:
        id:                  { type: string }
        companyId:           { type: string }
        pinId:               { type: string }
        accessCode:          { type: string, nullable: true }
        accessCodeExpiresAt: { type: string, format: date-time, nullable: true }
        status:              { type: string, enum: [draft, sent, signed, voided] }
        sentAt:              { type: string, format: date-time, nullable: true }
        coveredScopeCents:   { type: integer }
        bettermentsCents:    { type: integer }
        deductibleCents:     { type: integer }
        totalContractCents:  { type: integer }
        scopeSummary:        { type: string, nullable: true }
        scopeSource:         { type: string, nullable: true }
        templateId:          { type: string, nullable: true }
        documentObjectPath:  { type: string, nullable: true }
        documentSha256:      { type: string, nullable: true }
        customerSignedAt:    { type: string, format: date-time, nullable: true }
        customerPrintName:   { type: string, nullable: true }
        repSignedAt:         { type: string, format: date-time, nullable: true }
        voidedAt:            { type: string, format: date-time, nullable: true }
        voidedByUserId:      { type: string, nullable: true }
        voidReason:          { type: string, nullable: true }
        createdByUserId:     { type: string }
        createdAt:           { type: string, format: date-time }
        updatedAt:           { type: string, format: date-time }
        scopePackages:
          type: array
          items:
            $ref: "#/components/schemas/ContractScopePackage"

    ContractEnvelope:
      type: object
      required: [contract]
      properties:
        contract:
          $ref: "#/components/schemas/Contract"

    ContractListEnvelope:
      type: object
      required: [contracts]
      properties:
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/Contract"

    ContractScopePackageEnvelope:
      type: object
      required: [scopePackage]
      properties:
        scopePackage:
          type: object
          description: Raw scope package row (without nested selection; refetch contract for full shape).

    CreateContractInput:
      type: object
      properties:
        coveredScopeCents: { type: integer, minimum: 0 }
        deductibleCents:   { type: integer, minimum: 0 }
        scopeSummary:      { type: string }
        scopeSource:       { type: string, enum: [estimate, manual] }
        templateId:        { type: string }

    UpdateContractInput:
      type: object
      properties:
        coveredScopeCents: { type: integer, minimum: 0 }
        deductibleCents:   { type: integer, minimum: 0 }
        scopeSummary:      { type: string, nullable: true }
        scopeSource:       { type: string, enum: [estimate, manual], nullable: true }
        templateId:        { type: string, nullable: true }

    CreateContractScopePackageInput:
      type: object
      required: [categoryId, quantity, unit]
      properties:
        categoryId:         { type: string }
        quantity:           { type: number }
        unit:               { type: string }
        coveredAmountCents: { type: integer, minimum: 0 }
        sortOrder:          { type: integer }

    UpdateContractScopePackageInput:
      type: object
      properties:
        quantity:           { type: number }
        unit:               { type: string }
        coveredAmountCents: { type: integer, minimum: 0 }
        sortOrder:          { type: integer }

    VoidContractInput:
      type: object
      required: [voidReason]
      properties:
        voidReason: { type: string, minLength: 1 }

    InspectionEstimateForContractEnvelope:
      type: object
      required: [coveredScopeCents]
      properties:
        coveredScopeCents: { type: integer, nullable: true }
        source:            { type: string, enum: [estimate], nullable: true }

    # ── Contract Portal schemas (public) ─────────────────────────────────────

    PortalProductOption:
      type: object
      required: [id, name]
      properties:
        id:           { type: string }
        name:         { type: string }
        optionGroup:  { type: string, nullable: true }
        swatchHex:    { type: string, nullable: true }
        hoaCompliant: { type: boolean, nullable: true }

    PortalProduct:
      type: object
      required: [id, name, brandName, isBase, priceDeltaCents, unit, options]
      properties:
        id:              { type: string }
        name:            { type: string }
        brandName:       { type: string }
        isBase:          { type: boolean }
        priceDeltaCents: { type: integer }
        unit:            { type: string }
        description:     { type: string, nullable: true }
        options:
          type: array
          items:
            $ref: "#/components/schemas/PortalProductOption"

    PortalPackageSelection:
      type: object
      required: [productId, productName, brandName, unitDeltaCents, quantity, extendedDeltaCents, selectedBy]
      properties:
        productId:          { type: string }
        optionId:           { type: string, nullable: true }
        productName:        { type: string }
        brandName:          { type: string }
        optionName:         { type: string, nullable: true }
        unitDeltaCents:     { type: integer }
        quantity:           { type: string }
        extendedDeltaCents: { type: integer }
        selectedBy:         { type: string, description: "'customer' or 'rep'" }

    PortalScopePackage:
      type: object
      required: [id, categoryName, quantity, unit, coveredAmountCents, sortOrder, products]
      properties:
        id:                 { type: string }
        categoryId:         { type: string }
        categoryName:       { type: string }
        quantity:           { type: string }
        unit:               { type: string }
        coveredAmountCents: { type: integer }
        sortOrder:          { type: integer }
        selection:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/PortalPackageSelection"
        products:
          type: array
          items:
            $ref: "#/components/schemas/PortalProduct"

    PortalContractEnvelope:
      type: object
      required: [contract, property, company, packages]
      properties:
        contract:
          type: object
          required: [id, status, coveredScopeCents, bettermentsCents, deductibleCents, totalContractCents]
          properties:
            id:                 { type: string }
            status:             { type: string }
            coveredScopeCents:  { type: integer }
            bettermentsCents:   { type: integer }
            deductibleCents:    { type: integer }
            totalContractCents: { type: integer }
            scopeSummary:       { type: string, nullable: true }
            documentObjectPath: { type: string, nullable: true }
            documentSha256:     { type: string, nullable: true }
            customerSignedAt:   { type: string, format: date-time, nullable: true }
        property:
          type: object
          required: [address]
          properties:
            address: { type: string, nullable: true }
        company:
          type: object
          required: [name]
          properties:
            name: { type: string, nullable: true }
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PortalScopePackage"

    PortalSelectProductInput:
      type: object
      required: [productId]
      properties:
        productId: { type: string }
        optionId:  { type: string, nullable: true }

    PortalSelectionEnvelope:
      type: object
      required: [selection]
      properties:
        selection:
          type: object
          description: Raw selection row snapshot.

    PortalGenerateDocumentResponse:
      type: object
      required: [documentObjectPath, documentSha256]
      properties:
        documentObjectPath: { type: string }
        documentSha256:     { type: string }

    PortalVoidedResponse:
      type: object
      required: [error]
      properties:
        error:       { type: string }
        companyName: { type: string, nullable: true }

    PortalSignInput:
      type: object
      required: [customerPrintName, documentSha256]
      properties:
        customerSignatureBase64: { type: string }
        customerSignaturePath:   { type: string }
        customerPrintName:       { type: string, minLength: 1 }
        documentSha256:          { type: string, minLength: 64, maxLength: 64, description: "SHA-256 hex of the document the customer viewed; server rejects if it doesn't match the stored hash." }

    PortalSignResponse:
      type: object
      required: [status, customerSignedAt]
      properties:
        status:           { type: string }
        customerSignedAt: { type: string, format: date-time }
