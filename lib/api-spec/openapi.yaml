        context:
          type: object
          additionalProperties: true
        screenshotUrl:
          type: [string, "null"]
          maxLength: 1000
        appVersion:
          type: [string, "null"]
          maxLength: 50
        platform:
          type: [string, "null"]
          maxLength: 30
        osVersion:
          type: [string, "null"]
          maxLength: 50
