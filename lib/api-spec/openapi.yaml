    # ---- M-F (F1) Pre-flight ----
    PreflightResult:
      type: object
      required: [deficiencies, softFlags]
      description: >-
        Server-side re-run of the shared protocol gate. Mirrors the client
        readiness screen's evaluation exactly.
      properties:
        deficiencies:
          type: array
          items:
            $ref: "#/components/schemas/GateFinding"
        softFlags:
          type: array
          items:
            $ref: "#/components/schemas/GateFinding"
    PreflightResultEnvelope:
      type: object
      required: [preflight]
      properties:
        preflight:
          $ref: "#/components/schemas/PreflightResult"

    CurateInspectionPhotosRequest:
      type: object
      required: [curation]
      properties:
        curation:
          type: array
          minItems: 1
