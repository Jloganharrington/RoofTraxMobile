        Returns qualifying severe-weather candidates. Gated by the
        inspection module permission.
      parameters:
        - name: location
          in: query
          required: true
          description: Property location — "lat,long" or a city/address string.
          schema:
            type: string
        - name: dateOfLoss
          in: query
          required: false
          description: Claimed date of loss (YYYY-MM-DD); prioritizes candidates near it.
          schema:
            type: string
      responses:
        "200":
          description: Candidate storm events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherCandidatesEnvelope"
        "400":
          description: Invalid query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Inspection module not enabled for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Weather provider error or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /portal/{accessCode}:
