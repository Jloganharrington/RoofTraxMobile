          type: [string, "null"]
    TestSquareHitEnvelope:
      type: object
      required: [hit]
      properties:
        hit:
          $ref: "#/components/schemas/TestSquareHit"

    InspectionPhoto:
      type: object
      required:
        [
          id,
          companyId,
          inspectionId,
          stage,
          subjectType,
          subjectId,
          triadRole,
          preliminaryRole,
          url,
          sha256,
          exifJson,
          overlayJson,
          capturedAtUtc,
          latitude,
          longitude,
          zone,
          sidingRole,
          sidingComponentIndex,
          includeInProofPackage,
          createdAt,
        ]
      properties:
        id:
          type: string
        companyId:
          type: string
        inspectionId:
          type: string
        stage:
          oneOf:
            - $ref: "#/components/schemas/CaptureStage"
            - type: "null"
        subjectType:
          $ref: "#/components/schemas/InspectionSubjectType"
        subjectId:
          type: [string, "null"]
        triadRole:
          oneOf:
            - $ref: "#/components/schemas/PhotoTriadRole"
            - type: "null"
        preliminaryRole:
          oneOf:
            - $ref: "#/components/schemas/PreliminaryPhotoRole"
            - type: "null"
        captureContext:
          description: >-
            REPORT_DATA v2 — derived server-side from triadRole (wide→overview,
            mid→mid-range, close→close-up, measurement/collateral→themselves)
            or preliminaryRole (front_of_home/roof_overview→overview,
            damage close-ups→close-up). Null only when the photo carries no
            role at all.
          oneOf:
            - $ref: "#/components/schemas/PhotoCaptureContext"
            - type: "null"
        url:
          type: string
        sha256:
          type: string
        exifJson:
          type: [object, "null"]
        overlayJson:
          type: [object, "null"]
        capturedAtUtc:
          type: [string, "null"]
          format: date-time
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        zone:
          oneOf:
            - $ref: "#/components/schemas/ComponentZone"
            - type: "null"
        sidingRole:
          oneOf:
            - $ref: "#/components/schemas/SidingPhotoRole"
            - type: "null"
        sidingComponentIndex:
          type: [number, "null"]
          description: >-
            1-based component slot (S{n}C{k}) this photo evidences. Set only
            when sidingRole is 'component'.
        includeInProofPackage:
          type: boolean
          description: >-
            Pre-submission curation flag. When false the photo remains stored
            evidence but is omitted from Proof Package generation.
        createdAt:
          type: string
          format: date-time
    CreateInspectionPhotoInput:
      type: object
      required: [subjectType, url, sha256]
      properties:
        id:
          type: string
          description: >-
            Optional client-generated id for offline-first creation. When
            supplied, the photo write is idempotent, so a queued offline
            capture can be retried (e.g. after a lost upload response)
            without duplicating the evidence row.
        stage:
          oneOf:
            - $ref: "#/components/schemas/CaptureStage"
            - type: "null"
        subjectType:
          $ref: "#/components/schemas/InspectionSubjectType"
        subjectId:
          type: [string, "null"]
        triadRole:
          oneOf:
            - $ref: "#/components/schemas/PhotoTriadRole"
            - type: "null"
        preliminaryRole:
          oneOf:
            - $ref: "#/components/schemas/PreliminaryPhotoRole"
            - type: "null"
        url:
          type: string
          minLength: 1
        sha256:
          type: string
          minLength: 1
        exifJson:
          type: [object, "null"]
        overlayJson:
          type: [object, "null"]
        capturedAtUtc:
          type: [string, "null"]
          format: date-time
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        zone:
          oneOf:
            - $ref: "#/components/schemas/ComponentZone"
            - type: "null"
        sidingRole:
          oneOf:
            - $ref: "#/components/schemas/SidingPhotoRole"
            - type: "null"
        sidingComponentIndex:
          type: [number, "null"]
          minimum: 1
    InspectionPhotoEnvelope:
      type: object
      required: [photo]
      properties:
        photo:
          $ref: "#/components/schemas/InspectionPhoto"

    Measurement:
      type: object
      required: [id, companyId, inspectionId, subjectType, subjectId, measurementType, value, unit, createdAt]
      properties:
        id:
          type: string
        companyId:
          type: string
        inspectionId:
          type: string
        subjectType:
          $ref: "#/components/schemas/InspectionSubjectType"
        subjectId:
          type: [string, "null"]
        measurementType:
          type: string
        value:
          type: number
        unit:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    CreateMeasurementInput:
      type: object
      required: [subjectType, measurementType, value]
      properties:
        id:
          type: string
          description: >-
            Optional client-generated id for offline-first creation. When
            supplied, the measurement write is idempotent, so a queued offline
            measurement can be retried without duplicating the row.
        subjectType:
          $ref: "#/components/schemas/InspectionSubjectType"
        subjectId:
          type: [string, "null"]
        measurementType:
          type: string
          minLength: 1
        value:
          type: number
        unit:
          type: [string, "null"]
    MeasurementEnvelope:
      type: object
      required: [measurement]
      properties:
        measurement:
          $ref: "#/components/schemas/Measurement"

    InteriorObservation:
      type: object
      required: [id, companyId, inspectionId, location, observationType, moistureReading, notes, createdAt]
      properties:
        id:
          type: string
        companyId:
          type: string
        inspectionId:
          type: string
        location:
          type: string
        observationType:
          $ref: "#/components/schemas/InteriorObservationType"
        moistureReading:
          type: [number, "null"]
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    CreateInteriorObservationInput:
      type: object
      required: [location, observationType]
      properties:
        id:
          type: string
          description: Optional client-generated id for offline-first idempotent creation.
        location:
          type: string
          minLength: 1
        observationType:
          $ref: "#/components/schemas/InteriorObservationType"
        moistureReading:
          type: [number, "null"]
        notes:
          type: [string, "null"]
    InteriorObservationEnvelope:
      type: object
      required: [interiorObservation]
      properties:
        interiorObservation:
          $ref: "#/components/schemas/InteriorObservation"
    SubmitInspectionInput:
      type: object
      required: [manifest]
      properties:
        manifest:
          $ref: "#/components/schemas/SubmissionManifestV1"

    Attestation:
      type: object
      required: [id, companyId, inspectionId, userId, stage, attestationType, details, signatureData, attestedAt]
      properties:
        id:
          type: string
        companyId:
          type: string
        inspectionId:
          type: string
        userId:
          type: string
        stage:
          oneOf:
            - $ref: "#/components/schemas/CaptureStage"
            - type: "null"
        attestationType:
          oneOf:
            - $ref: "#/components/schemas/AttestationType"
            - type: "null"
        details:
          type: [object, "null"]
          additionalProperties: true
        signatureData:
          type: [string, "null"]
        attestedAt:
          type: string
          format: date-time
    CreateAttestationInput:
      type: object
      properties:
        id:
          type: string
          description: >-
            Optional client-generated id for offline-first creation. When
            supplied, the attestation write is idempotent, so a queued
            offline attestation can be retried without duplicating the row.
        stage:
          oneOf:
            - $ref: "#/components/schemas/CaptureStage"
            - type: "null"
        attestationType:
          oneOf:
            - $ref: "#/components/schemas/AttestationType"
            - type: "null"
        details:
          type: [object, "null"]
          additionalProperties: true
        signatureData:
          type: [string, "null"]
    AttestationEnvelope:
      type: object
      required: [attestation]
      properties:
        attestation:
          $ref: "#/components/schemas/Attestation"

    CanvassingSession:
      type: object
      required: [id, companyId, userId, startedAt, endedAt]
      properties:
        id:
          type: string
        companyId:
          type: string
        userId:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time
    CanvassingSessionEnvelope:
      type: object
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/CanvassingSession"
    CanvassingCurrentEnvelope:
      type: object
      required: [session]
      properties:
        session:
          oneOf:
            - $ref: "#/components/schemas/CanvassingSession"
            - type: "null"

    ScheduledInspection:
      type: object
      description: >-
        A CRM-scheduled inspection (B3). The scheduled feed is a CRM seam —
        for now the server returns an empty list; the shape is fixed so the
        prefill path can be built ahead of the data.
      required:
        [id, scheduledFor, insuredName, propertyAddress, carrier, policyNumber, claimNumber, dateOfLoss, latitude, longitude]
      properties:
        id:
          type: string
        scheduledFor:
          type: [string, "null"]
          format: date-time
        insuredName:
          type: [string, "null"]
        propertyAddress:
          type: [string, "null"]
        carrier:
          type: [string, "null"]
        policyNumber:
          type: [string, "null"]
        claimNumber:
          type: [string, "null"]
        dateOfLoss:
          type: [string, "null"]
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
    ScheduledInspectionListEnvelope:
      type: object
      required: [scheduled]
      properties:
        scheduled:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledInspection"

    # ---- M-F (F1) Pre-flight ----
    PreflightResult:
      type: object
      required: [deficiencies, softFlags]
      description: >-
        Server-side re-run of the shared protocol gate. Mirrors the client
        readiness screen's evaluation exactly.
      properties:
        deficiencies:
          type: array
          items:
            $ref: "#/components/schemas/GateFinding"
        softFlags:
          type: array
          items:
            $ref: "#/components/schemas/GateFinding"
    PreflightResultEnvelope:
      type: object
      required: [preflight]
      properties:
        preflight:
          $ref: "#/components/schemas/PreflightResult"

    CurateInspectionPhotosRequest:
      type: object
      required: [curation]
      properties:
        curation:
          type: array
          minItems: 1
          items:
            type: object
            required: [photoId, include]
            properties:
              photoId:
                type: string
              include:
                type: boolean

    CurationResultEnvelope:
      type: object
      required: [updated, includedCount]
      properties:
        updated:
          type: number
          description: How many photo rows were updated.
        includedCount:
          type: number
          description: Total photos on the inspection now flagged for the Proof Package.

    # ---- M-F (F3) Status & package receipt ----
    PackageReceipt:
      type: object
      description: >-
        STUB receipt (M-F / F3). The standalone Brain that renders the real
        package does not exist yet; this is a clearly-labeled placeholder that
        reports what the intake verified, never a fabricated deliverable.
      required:
        [stage, label, message, isStub, verifiedPhotoCount, recordCount, generatedAtUtc]
      properties:
        stage:
          type: string
          enum: [pending, received, validated]
        label:
          type: string
        message:
          type: string
        isStub:
          type: boolean
        verifiedPhotoCount:
          type: integer
        recordCount:
          type: integer
        generatedAtUtc:
          type: string
          format: date-time
    InspectionStatusEnvelope:
      type: object
      required: [status, lockedAt, submissionManifest, receipt]
      properties:
        status:
          $ref: "#/components/schemas/InspectionStatus"
        lockedAt:
          type: [string, "null"]
          format: date-time
        submissionManifest:
          oneOf:
            - $ref: "#/components/schemas/SubmissionManifestV1"
            - type: "null"
        receipt:
          oneOf:
            - $ref: "#/components/schemas/PackageReceipt"
            - type: "null"

    # ---- M-F (F2) Addenda ----
    CreateInspectionAddendumInput:
      type: object
      required: [body]
      description: >-
        A post-lock correction. `id` is an optional client-generated id so an
        offline replay is idempotent.
      properties:
        id:
          type: string
        body:
          type: string
          minLength: 1
    InspectionAddendum:
      type: object
      required: [id, companyId, inspectionId, userId, body, createdAt]
      properties:
        id:
          type: string
        companyId:
          type: string
        inspectionId:
          type: string
        userId:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    InspectionAddendumEnvelope:
      type: object
      required: [addendum]
      properties:
        addendum:
          $ref: "#/components/schemas/InspectionAddendum"

    # ---- M-F (F4) CRM seam ----
    CrmThreadStatus:
      type: string
      enum: [pending, active]
    CrmStatus:
      type: object
      description: >-
        Per-tenant CRM seam status (M-F / F4). "pending" means no CRM field key
        is provisioned for the company, so inbound/outbound threads read empty
        rather than fabricating data.
      required: [enabled, scheduledFeed, appointmentSync, reportIngest]
      properties:
        enabled:
          type: boolean
        scheduledFeed:
          $ref: "#/components/schemas/CrmThreadStatus"
        appointmentSync:
          $ref: "#/components/schemas/CrmThreadStatus"
        reportIngest:
          $ref: "#/components/schemas/CrmThreadStatus"
    CrmStatusEnvelope:
      type: object
      required: [crm]
      properties:
        crm:
          $ref: "#/components/schemas/CrmStatus"

    ActivityScope:
      type: string
      enum: [own, total, department, individual]
    LeaderboardEntry:
      type: object
      required: [userId, name, pinsDropped, appointmentsSet, appointmentsCompleted, rank]
      properties:
        userId:
          type: string
        name:
          type: string
        pinsDropped:
          type: integer
        appointmentsSet:
          type: integer
        appointmentsCompleted:
          type: [integer, "null"]
          description: CRM-owned metric. Null until the CRM seam is wired.
        rank:
          type: integer
    ActivityMetrics:
      type: object
      required: [pinsDropped, appointmentsSet, appointmentsCompleted, hoursTracked]
      properties:
        pinsDropped:
          type: integer
        appointmentsSet:
          type: integer
        appointmentsCompleted:
          type: [integer, "null"]
          description: CRM-owned metric. Null until the CRM seam is wired.
        hoursTracked:
          type: number
    CompetitivePanel:
      type: object
      description: Trailing-30-day competitive comparison.
      required: [me, teamTotal, myRank, cohortSize]
      properties:
        me:
          $ref: "#/components/schemas/ActivityMetrics"
        teamTotal:
          $ref: "#/components/schemas/ActivityMetrics"
        myRank:
          type: [integer, "null"]
        cohortSize:
          type: integer
    ActivityStats:
      type: object
      required: [scope, canViewLeaderboard, period, competitive, leaderboard, myRank]
      properties:
        scope:
          $ref: "#/components/schemas/ActivityScope"
        canViewLeaderboard:
          type: boolean
          description: True for manager and above; field reps see only their own numbers plus rank.
        period:
          $ref: "#/components/schemas/ActivityMetrics"
        competitive:
          $ref: "#/components/schemas/CompetitivePanel"
        leaderboard:
          type: array
          description: Named leaderboard. Empty for field reps.
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        myRank:
          type: [integer, "null"]
    ActivityStatsEnvelope:
      type: object
      required: [stats]
      properties:
        stats:
          $ref: "#/components/schemas/ActivityStats"

    WeatherCandidate:
      type: object
      description: A deterministic candidate storm event (B5). No AI scoring.
      required: [date, type, hailSize, windSpeed, tornado, severityScore, description, time]
      properties:
        date:
          type: string
        # Local time of day (HH:MM, 24h) of the day's primary event, when the
        # provider reported one.
        time:
          type: [string, "null"]
        type:
          type: string
          enum: [hail, wind, tornado]
        hailSize:
          type: [number, "null"]
        windSpeed:
          type: [number, "null"]
        tornado:
          type: boolean
        severityScore:
          type: number
        description:
          type: [string, "null"]
    WeatherCandidatesEnvelope:
      type: object
      required: [candidates, queriedLocation, dateOfLoss, cached]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/WeatherCandidate"
        queriedLocation:
          type: string
        dateOfLoss:
          type: [string, "null"]
        cached:
          type: boolean
