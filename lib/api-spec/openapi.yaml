          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInteriorObservationInput"
      responses:
        "201":
          description: Interior observation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteriorObservationEnvelope"
        "200":
          description: Observation already existed (idempotent replay).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteriorObservationEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not authorized to modify this inspection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Inspection not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Observation id already exists on another inspection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /inspections/{inspectionId}/submission:
    post:
      tags: [Inspections]
      operationId: submitInspection
      summary: Submit the assembled inspection package (thin accept — M-F adds verification)
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInspectionInput"
      responses:
        "200":
          description: Submission accepted; inspection transitioned to submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not authorized to modify this inspection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Inspection not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /inspections/scheduled:
    get:
      tags: [Inspections]
      operationId: listScheduledInspections
