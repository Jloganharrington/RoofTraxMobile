  /weather/events:
    get:
      tags: [Weather]
      operationId: getWeatherEvents
      summary: Deterministic candidate storm events for a location and date of loss
      description: >-
        Extracted VisualCrossing retrieval + gating logic (no AI scoring).
        Returns qualifying severe-weather candidates. Gated by the
        inspection module permission.
      parameters:
        - name: location
          in: query
          required: true
          description: Property location — "lat,long" or a city/address string.
          schema:
            type: string
        - name: dateOfLoss
          in: query
          required: false
          description: Claimed date of loss (YYYY-MM-DD); prioritizes candidates near it.
          schema:
            type: string
      responses:
        "200":
          description: Candidate storm events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherCandidatesEnvelope"
        "400":
          description: Invalid query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Inspection module not enabled for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Weather provider error or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, companyId]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
        companyId:
          type: string
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    CompanyEnvelope:
      type: object
      required: [company]
      properties:
        company:
          $ref: "#/components/schemas/Company"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
        companyId:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

    Role:
      type: string
      enum: [field_rep, manager, admin, super_admin]
    WorkflowAssignment:
      type: string
      enum: [retail, insurance_retail]
    Department:
      type: string
      enum: [canvasser, inspector_canvasser]
    PinWorkflow:
      type: string
      enum: [retail, insurance]
    DamageType:
      type: string
      enum: [roof, siding, roof_and_siding]
    DoorKnockResult:
      type: string
      enum: [no_answer, no_appointment, appointment]
    ContactOutcome:
      type: string
      enum: [no_soliciting, priority_inspection, call_to_schedule]

    Profile:
      type: object
      required:
        [
          userId,
          role,
          workflowAssignment,
          department,
          companyId,
          companyName,
          signatureUrl,
          signatureSha256,
          signatureSignedAt,
        ]
      properties:
        userId:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        workflowAssignment:
          $ref: "#/components/schemas/WorkflowAssignment"
        department:
          $ref: "#/components/schemas/Department"
        companyId:
          type: string
        companyName:
          type: string
        # Signature-on-file (M-F / F0). Null until the inspector captures a
        # signature on their profile. The URL points at the tenant-scoped
        # object-storage copy; the SHA-256 is an integrity proof of the exact
        # bytes; signedAt is when it was captured.
        signatureUrl:
          type: [string, "null"]
        signatureSha256:
          type: [string, "null"]
        signatureSignedAt:
          type: [string, "null"]
          format: date-time
        # Outbound SMTP settings (server-side report emailing). The password
        # is write-only: it is never returned. smtpConfigured indicates a
        # complete, usable configuration exists.
        smtpConfigured:
          type: boolean
        smtpHost:
          type: [string, "null"]
        smtpPort:
          type: [number, "null"]
        smtpSecure:
          type: [boolean, "null"]
        smtpUsername:
          type: [string, "null"]
        smtpFromEmail:
          type: [string, "null"]
        # Beta instrument gate (company-level): whether the in-app bug-report
        # button renders. Exposed on the profile so the mobile client needs no
        # separate settings fetch.
        betaBugReporting:
          type: boolean
    BugReportSeverity:
      type: string
      enum: [blocks_me, annoying, cosmetic]
    BugReportStatus:
      type: string
      enum: [new, triaged, fixed]
    CreateBugReportInput:
      type: object
      required: [id, route, severity, description, context]
      properties:
        # Client-generated UUID — bug reports replay from the mobile outbox,
        # so creation must be idempotent across retries.
        id:
          type: string
          minLength: 8
          maxLength: 64
        route:
          type: string
          maxLength: 300
        routeParams:
          type: object
          additionalProperties: true
        severity:
          $ref: "#/components/schemas/BugReportSeverity"
        description:
          type: string
          minLength: 1
          maxLength: 5000
        # The auto-captured context blob (whole, unflattened): inspection
        # state, outbox counts, connectivity, etc.
        context:
          type: object
          additionalProperties: true
        screenshotUrl:
          type: [string, "null"]
          maxLength: 1000
        appVersion:
          type: [string, "null"]
          maxLength: 50
        platform:
          type: [string, "null"]
          maxLength: 30
        osVersion:
          type: [string, "null"]
          maxLength: 50
        capturedAt:
          type: [string, "null"]
          format: date-time
    UpdateBugReportInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/BugReportStatus"
        internalNote:
          type: [string, "null"]
          maxLength: 5000
    BugReport:
      type: object
      required:
        [
          id,
          companyId,
          userId,
          route,
          severity,
          description,
          context,
          status,
          createdAt,
        ]
      properties:
        id:
          type: string
        companyId:
          type: string
        userId:
          type: string
        reporterName:
          type: [string, "null"]
        reporterEmail:
          type: [string, "null"]
        route:
          type: string
        routeParams:
          type: [object, "null"]
          additionalProperties: true
        severity:
          $ref: "#/components/schemas/BugReportSeverity"
        description:
          type: string
        context:
          type: object
          additionalProperties: true
        screenshotUrl:
          type: [string, "null"]
        appVersion:
          type: [string, "null"]
        platform:
          type: [string, "null"]
        osVersion:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/BugReportStatus"
        internalNote:
          type: [string, "null"]
        resolvedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    BugReportEnvelope:
      type: object
      required: [bugReport]
      properties:
        bugReport:
          $ref: "#/components/schemas/BugReport"
    BugReportListEnvelope:
      type: object
      required: [bugReports]
      properties:
        bugReports:
          type: array
          items:
            $ref: "#/components/schemas/BugReport"
    UpdateProfileSmtpInput:
      type: object
      description: >-
        Sets the user's outbound SMTP configuration. Send all fields to
        configure; the password is stored encrypted and never returned.
        Setting clear=true removes the configuration entirely.
      properties:
        clear:
          type: boolean
        host:
          type: string
          minLength: 1
        port:
          type: number
          minimum: 1
          maximum: 65535
        secure:
          type: boolean
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        fromEmail:
          type: string
          minLength: 1
    EmailReportInput:
      type: object
      required: [recipient, pdfBase64, filename]
      properties:
        recipient:
          type: string
          minLength: 3
          maxLength: 320
        pdfBase64:
          type: string
          minLength: 1
          # ~10MB of PDF once base64-decoded; the route's body limit is 15MB.
          maxLength: 14000000
        filename:
          type: string
          minLength: 1
          maxLength: 200
        subject:
          type: string
          maxLength: 500
        body:
          type: string
          maxLength: 5000
    EmailReportResult:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean
    UpdateProfileSignatureInput:
      type: object
      required: [signatureUrl, signatureSha256]
      description: >-
        Records the inspector's signature-on-file (M-F / F0). The client
        uploads the signature image to object storage via the presigned-URL
        flow, then sends the servable URL plus a SHA-256 of the exact bytes.
        The server stamps signedAt server-side.
      properties:
        signatureUrl:
          type: string
          minLength: 1
        signatureSha256:
          type: string
          minLength: 1
