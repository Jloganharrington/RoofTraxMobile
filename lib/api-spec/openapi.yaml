    InspectionPhoto:
      type: object
      required:
        [
          id,
          companyId,
          inspectionId,
          stage,
          subjectType,
          subjectId,
          triadRole,
          preliminaryRole,
          url,
          sha256,
          exifJson,
          overlayJson,
          capturedAtUtc,
          latitude,
          longitude,
          zone,
          sidingRole,
          sidingComponentIndex,
          includeInProofPackage,
          createdAt,
        ]
      properties:
        id:
          type: string
        companyId:
          type: string
        inspectionId:
          type: string
        stage:
          oneOf:
            - $ref: "#/components/schemas/CaptureStage"
            - type: "null"
        subjectType:
          $ref: "#/components/schemas/InspectionSubjectType"
        subjectId:
          type: [string, "null"]
        triadRole:
          oneOf:
            - $ref: "#/components/schemas/PhotoTriadRole"
            - type: "null"
        preliminaryRole:
          oneOf:
            - $ref: "#/components/schemas/PreliminaryPhotoRole"
            - type: "null"
        captureContext:
          description: >-
            REPORT_DATA v2 — derived server-side from triadRole (wide→overview,
            mid→mid-range, close→close-up, measurement/collateral→themselves)
            or preliminaryRole (front_of_home/roof_overview→overview,
            damage close-ups→close-up). Null only when the photo carries no
            role at all.
          oneOf:
            - $ref: "#/components/schemas/PhotoCaptureContext"
            - type: "null"
        url:
          type: string
        sha256:
          type: string
        exifJson:
          type: [object, "null"]
        overlayJson:
          type: [object, "null"]
        capturedAtUtc:
          type: [string, "null"]
          format: date-time
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        zone:
          oneOf:
            - $ref: "#/components/schemas/ComponentZone"
            - type: "null"
        sidingRole:
          oneOf:
            - $ref: "#/components/schemas/SidingPhotoRole"
            - type: "null"
        sidingComponentIndex:
          type: [number, "null"]
          description: >-
            1-based component slot (S{n}C{k}) this photo evidences. Set only
            when sidingRole is 'component'.
        includeInProofPackage:
          type: boolean
          description: >-
            Pre-submission curation flag. When false the photo remains stored
            evidence but is omitted from Proof Package generation.
        createdAt:
          type: string
          format: date-time
    CreateInspectionPhotoInput:
      type: object
      required: [subjectType, url, sha256]
      properties:
        id:
          type: string
          description: >-
            Optional client-generated id for offline-first creation. When
            supplied, the photo write is idempotent, so a queued offline
            capture can be retried (e.g. after a lost upload response)
            without duplicating the evidence row.
        stage:
          oneOf:
            - $ref: "#/components/schemas/CaptureStage"
            - type: "null"
        subjectType:
          $ref: "#/components/schemas/InspectionSubjectType"
        subjectId:
          type: [string, "null"]
        triadRole:
          oneOf:
            - $ref: "#/components/schemas/PhotoTriadRole"
            - type: "null"
        preliminaryRole:
          oneOf:
            - $ref: "#/components/schemas/PreliminaryPhotoRole"
            - type: "null"
        url:
          type: string
          minLength: 1
        sha256:
          type: string
          minLength: 1
        exifJson:
          type: [object, "null"]
        overlayJson:
          type: [object, "null"]
        capturedAtUtc:
          type: [string, "null"]
          format: date-time
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        zone:
          oneOf:
            - $ref: "#/components/schemas/ComponentZone"
            - type: "null"
        sidingRole:
          oneOf:
            - $ref: "#/components/schemas/SidingPhotoRole"
            - type: "null"
        sidingComponentIndex:
          type: [number, "null"]
          minimum: 1
