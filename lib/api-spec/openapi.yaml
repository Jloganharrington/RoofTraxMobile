          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /inspections/{inspectionId}/preflight:
    post:
      tags: [Inspections]
      operationId: preflightInspection
      summary: >-
        Re-run the shared protocol gate server-side (M-F / F1) so the inspector
        can resolve deficiencies while still on-site. Authoritative — the
        server hydrates the record and runs the SAME lib/protocol evaluate() the
        mobile readiness screen runs.
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gate evaluation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightResultEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not authorized to access this inspection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Inspection not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /inspections/{inspectionId}/status:
    get:
      tags: [Inspections]
      operationId: getInspectionStatus
      summary: >-
        Poll an inspection's submission status and package receipt (M-F / F3).
        Returns a clearly-labeled STUB receipt until the standalone Brain exists.
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inspection status and package receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionStatusEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Inspection module not enabled for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Inspection not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /inspections/{inspectionId}/addenda:
    post:
      tags: [Inspections]
      operationId: createInspectionAddendum
      summary: >-
        File a post-lock correction as an append-only addendum (M-F / F2). A
        locked inspection is immutable; corrections never edit the original
        record. Allowed after lock; the only inspection write that is.
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInspectionAddendumInput"
      responses:
        "201":
          description: Addendum recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionAddendumEnvelope"
        "200":
          description: Addendum already existed (idempotent replay).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionAddendumEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not authorized to modify this inspection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Inspection not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /bug-reports:
