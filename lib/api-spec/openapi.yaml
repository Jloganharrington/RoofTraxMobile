      operationId: getInspectionReportPreviewUrl
      summary: >-
        Render the compiled forensic report HTML with fresh photo URLs and return it
        directly. Returns 404 when no report has been compiled yet.
        Photo URLs are regenerated on every call (15-min TTL each) so the HTML
        is always valid at the moment of delivery — the stored artifact never embeds
        expiring signed URLs.
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Freshly-rendered HTML string ready to load in a WebView.
          content:
