      type: object
      properties:
        voidReason:
          type: string
    ChangeOrder:
      type: object
      required:
        - id
        - companyId
        - pinId
        - description
        - amountCents
        - status
        - requiredToCompleteScope
        - approvedAt
        - homeownerSignedAt
        - documentObjectPath
        - voidedAt
        - createdByUserId
        - createdAt
        - updatedAt
        - lineItems
      properties:
        id:
          type: string
        companyId:
          type: string
        pinId:
          type: string
        description:
          type: string
        amountCents:
          type: integer
          description: >-
            DERIVED — always the sum of lineItems[].totalCents. Never
            client-settable. May be negative when deductive items dominate.
        status:
          type: string
          enum: [pending, approved, rejected]
        requiredToCompleteScope:
          type: boolean
          description: >-
            true = hidden condition / undocumented work required to finish
            the original scope (supplement candidate on insurance jobs).
        documentObjectPath:
          type: [string, "null"]
        documentSha256:
          type: [string, "null"]
        homeownerSignaturePath:
          type: [string, "null"]
        homeownerSignedAt:
          type: [string, "null"]
          format: date-time
          description: Server-stamped when /sign is called.
        repSignaturePath:
          type: [string, "null"]
        repSignedAt:
          type: [string, "null"]
          format: date-time
        approvedAt:
          type: [string, "null"]
          format: date-time
          description: Server-stamped when /approve is called; null otherwise.
        voidedAt:
          type: [string, "null"]
          format: date-time
        voidedByUserId:
          type: [string, "null"]
        voidReason:
          type: [string, "null"]
        emailedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Server-stamped when the signed PDF is successfully emailed on
            approval (best-effort via per-user SMTP). Null if SMTP is not
            configured or the send failed.
        createdByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/ChangeOrderLineItem"
    ChangeOrderEnvelope:
