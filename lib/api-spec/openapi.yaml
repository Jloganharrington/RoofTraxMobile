              photoId:
                type: string
              include:
                type: boolean

    CurationResultEnvelope:
      type: object
      required: [updated, includedCount]
      properties:
        updated:
          type: number
          description: How many photo rows were updated.
        includedCount:
          type: number
          description: Total photos on the inspection now flagged for the Proof Package.

    # ---- M-F (F3) Status & package receipt ----
    PackageReceipt:
      type: object
      description: >-
        STUB receipt (M-F / F3). The standalone Brain that renders the real
        package does not exist yet; this is a clearly-labeled placeholder that
        reports what the intake verified, never a fabricated deliverable.
      required:
        [stage, label, message, isStub, verifiedPhotoCount, recordCount, generatedAtUtc]
      properties:
        stage:
          type: string
          enum: [pending, received, validated]
        label:
          type: string
        message:
          type: string
        isStub:
          type: boolean
        verifiedPhotoCount:
          type: integer
        recordCount:
          type: integer
        generatedAtUtc:
          type: string
          format: date-time
    InspectionStatusEnvelope:
      type: object
      required: [status, lockedAt, submissionManifest, receipt]
      properties:
        status:
          $ref: "#/components/schemas/InspectionStatus"
        lockedAt:
          type: [string, "null"]
          format: date-time
        submissionManifest:
          oneOf:
            - $ref: "#/components/schemas/SubmissionManifestV1"
            - type: "null"
        receipt:
          oneOf:
            - $ref: "#/components/schemas/PackageReceipt"
            - type: "null"

    # ---- M-F (F2) Addenda ----
    CreateInspectionAddendumInput:
      type: object
      required: [body]
      description: >-
        A post-lock correction. `id` is an optional client-generated id so an
        offline replay is idempotent.
      properties:
        id:
          type: string
        body:
          type: string
          minLength: 1
    InspectionAddendum:
      type: object
      required: [id, companyId, inspectionId, userId, body, createdAt]
      properties:
        id:
          type: string
        companyId:
          type: string
        inspectionId:
          type: string
        userId:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    InspectionAddendumEnvelope:
      type: object
      required: [addendum]
      properties:
        addendum:
          $ref: "#/components/schemas/InspectionAddendum"

    # ---- M-F (F4) CRM seam ----
    CrmThreadStatus:
      type: string
      enum: [pending, active]
    CrmStatus:
      type: object
      description: >-
        Per-tenant CRM seam status (M-F / F4). "pending" means no CRM field key
        is provisioned for the company, so inbound/outbound threads read empty
        rather than fabricating data.
      required: [enabled, scheduledFeed, appointmentSync, reportIngest]
      properties:
        enabled:
          type: boolean
        scheduledFeed:
          $ref: "#/components/schemas/CrmThreadStatus"
        appointmentSync:
          $ref: "#/components/schemas/CrmThreadStatus"
        reportIngest:
          $ref: "#/components/schemas/CrmThreadStatus"
    CrmStatusEnvelope:
      type: object
      required: [crm]
      properties:
        crm:
          $ref: "#/components/schemas/CrmStatus"

    ActivityScope:
      type: string
      enum: [own, total, department, individual]
    LeaderboardEntry:
      type: object
      required: [userId, name, pinsDropped, appointmentsSet, appointmentsCompleted, rank]
      properties:
        userId:
          type: string
        name:
          type: string
        pinsDropped:
          type: integer
        appointmentsSet:
          type: integer
        appointmentsCompleted:
          type: [integer, "null"]
          description: CRM-owned metric. Null until the CRM seam is wired.
        rank:
          type: integer
    ActivityMetrics:
      type: object
      required: [pinsDropped, appointmentsSet, appointmentsCompleted, hoursTracked]
      properties:
        pinsDropped:
          type: integer
        appointmentsSet:
          type: integer
        appointmentsCompleted:
          type: [integer, "null"]
          description: CRM-owned metric. Null until the CRM seam is wired.
        hoursTracked:
          type: number
    CompetitivePanel:
      type: object
      description: Trailing-30-day competitive comparison.
      required: [me, teamTotal, myRank, cohortSize]
      properties:
        me:
          $ref: "#/components/schemas/ActivityMetrics"
        teamTotal:
          $ref: "#/components/schemas/ActivityMetrics"
        myRank:
          type: [integer, "null"]
        cohortSize:
          type: integer
    ActivityStats:
      type: object
      required: [scope, canViewLeaderboard, period, competitive, leaderboard, myRank]
      properties:
        scope:
          $ref: "#/components/schemas/ActivityScope"
        canViewLeaderboard:
          type: boolean
          description: True for manager and above; field reps see only their own numbers plus rank.
        period:
          $ref: "#/components/schemas/ActivityMetrics"
        competitive:
          $ref: "#/components/schemas/CompetitivePanel"
        leaderboard:
          type: array
          description: Named leaderboard. Empty for field reps.
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        myRank:
          type: [integer, "null"]
    ActivityStatsEnvelope:
      type: object
      required: [stats]
      properties:
        stats:
          $ref: "#/components/schemas/ActivityStats"

    DashboardWidgetMeta:
      type: object
      description: >-
        Manifest metadata for a single dashboard widget. Contains key, title,
        and size only — never widget payload data (rows, values, etc.).
      required: [key, title, size]
      properties:
        key:
          type: string
          description: Stable identifier matching the WIDGET_CATALOG key.
        title:
          type: string
          description: Display label for the widget header.
        size:
          type: string
          enum: [sm, md, lg]
          description: Layout hint for skeleton sizing before data loads.

    GridCellEntry:
      type: object
      required: [key, x, y, w, h]
      description: >-
        A single widget's position and size within the 12-column resizable
        dashboard grid. x/y are zero-indexed column/row coordinates; w/h are
        column-span and row-span respectively.
      properties:
        key:
          type: string
          description: Widget key — matches WIDGET_CATALOG key.
        x:
          type: integer
          minimum: 0
          maximum: 11
          description: Column index (0–11).
        y:
          type: integer
          minimum: 0
          maximum: 999
          description: Row index (0-based). Upper bound prevents runaway stored values.
        w:
          type: integer
          minimum: 1
          maximum: 12
          description: Width in grid columns (1–12).
        h:
          type: integer
          minimum: 1
          maximum: 20
          description: Height in grid rows (1–20).

    DashboardManifestEnvelope:
      type: object
      required: [widgets]
      properties:
        widgets:
          type: array
          description: Ordered list of widgets this user is permitted to see.
          items:
            $ref: "#/components/schemas/DashboardWidgetMeta"
        gridLayout:
          type: array
          nullable: true
          maxItems: 50
          description: >-
            Stored per-user grid positions. Null when the user has never saved
            a custom layout; the frontend derives defaults from widget sizes.
          items:
            $ref: "#/components/schemas/GridCellEntry"

    DashboardLayoutWidgetEntry:
      type: object
      required: [key, title, size, hidden]
      description: A widget entry with its current visibility state.
      properties:
        key:
          type: string
          description: Stable identifier matching the WIDGET_CATALOG key.
        title:
          type: string
          description: Display label for the widget header.
        size:
          type: string
          enum: [sm, md, lg]
          description: Layout hint for skeleton sizing.
        hidden:
          type: boolean
          description: >-
            True if this widget is currently hidden by the user's stored layout.
            Granted widgets with hidden:true are excluded from the dashboard manifest
            but appear here so settings UIs can toggle them back on individually.

    DashboardLayoutEnvelope:
      type: object
      required: [widgets]
      description: >-
        Full capability-resolved widget set with visibility state. Used by the
        settings UI; the dashboard grid should use GET /dashboard/manifest instead.
      properties:
        widgets:
          type: array
          description: >-
            All granted widgets in display order (visible first per stored order,
            then hidden ones appended in catalog order). Each row includes a
            hidden flag indicating current visibility preference.
          items:
            $ref: "#/components/schemas/DashboardLayoutWidgetEntry"

    DashboardLayoutInput:
      type: object
      additionalProperties: false
      description: >-
        User's widget layout preferences. All fields are optional — omitted
        fields are preserved from the existing stored layout. Hidden keys
        subtract from the capability-resolved set; order keys sort the result;
        gridLayout stores per-widget drag/resize positions. Unknown or
        uncapable keys are silently ignored at manifest resolution time.
      properties:
        hidden:
          type: array
          maxItems: 50
          description: Widget keys to hide from the dashboard.
          items:
            type: string
        order:
          type: array
          maxItems: 50
          description: Desired display order of widget keys (front of list first).
          items:
            type: string
        gridLayout:
          type: array
          nullable: true
          maxItems: 50
          description: >-
            Per-widget grid positions. Pass null to clear saved positions and
            revert to catalog-size defaults.
          items:
            $ref: "#/components/schemas/GridCellEntry"

    ProfileTheme:
      type: string
      enum: [light, dark, system]
      description: UI colour scheme preference stored on the user's profile.

    ActionRequiredItem:
      type: object
      required: [id, category, label, ownerName, ownerId, stuckForLabel, rank, pinId]
      description: >-
        A single item surfaced by the action-required widget. Represents a lead
        or inspection that is stuck and needs a manager's attention.
      properties:
        id:
          type: string
          description: Unique identifier for this action item (derived from pin/inspection id + category).
        category:
          type: string
          enum: [overdue_loop, stalled_stage, blocked_claim, needs_review]
          description: Classification of why this item requires attention.
        label:
          type: string
          description: Human-readable description of what is stuck.
        ownerName:
          type: string
          description: Display name of the rep who owns this lead.
        ownerId:
          type: string
          description: User id of the rep who owns this lead.
        stuckForLabel:
          type: string
          description: >-
            Server-computed human-readable duration string (e.g. "14 days", "1 day", "< 1 day").
            Clients must not recompute this from timestamps.
        rank:
          type: number
          description: Numeric sort score (higher = more urgent). Pre-sorted descending in the response.
        pinId:
          type: string
          description: Id of the associated pin. Use for deep-link navigation to /leads/:pinId.
        inspectionId:
          type: [string, "null"]
          description: Id of the associated inspection. Present for blocked_claim items.
        detail:
          type: [string, "null"]
          description: Optional secondary context line (e.g. pipeline stage label, claim status).
        pipelineStage:
          type: [string, "null"]
          description: >-
            Current pipeline stage key of the pin. Present for overdue_loop and stalled_stage items.
            Clients may use this as toStage when calling advance-stage inline.

    ActionRequiredEnvelope:
      type: object
      required: [items, total, capped]
      description: Response envelope for the action-required widget endpoint.
      properties:
        items:
          type: array
          description: Ranked action-required items (at most 25), sorted by rank descending.
          items:
            $ref: "#/components/schemas/ActionRequiredItem"
        total:
          type: integer
          description: Total count of matching items before the 25-item cap.
        capped:
          type: boolean
          description: True when total exceeds 25 and the response was truncated.

    KnockToLeadEnvelope:
      type: object
      required: [totalKnocks, totalLeads, conversionRate, windowDays, repBreakdown]
      description: Knock-to-lead conversion metrics for the company.
      properties:
        totalKnocks:
          type: integer
          description: Pins with any doorKnockResult in the rolling window.
        totalLeads:
          type: integer
          description: Pins where doorKnockResult = 'appointment' in the window.
        conversionRate:
          type: number
          description: totalLeads / totalKnocks, or 0 when totalKnocks is 0.
        windowDays:
          type: integer
          description: Rolling window used for the query.
        repBreakdown:
          type: array
          description: Per-rep breakdown sorted by knocks descending.
          items:
            $ref: "#/components/schemas/KnockToLeadRepRow"

    KnockToLeadRepRow:
      type: object
      required: [userId, name, knocks, leads, conversionRate]
      properties:
        userId:
          type: string
        name:
          type: string
        knocks:
          type: integer
        leads:
          type: integer
        conversionRate:
          type: number

    CanvassingHeatmapEnvelope:
      type: object
      required: [points, total, capped, windowDays]
      description: Heatmap data envelope for the canvassing_heatmap widget.
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapPoint"
        total:
          type: integer
          description: Total matching pins before the cap.
        capped:
          type: boolean
          description: True when the result was truncated to the cap.
        windowDays:
          type: integer
          description: Recency window used.

    HeatmapPoint:
      type: object
      required: [lat, lng, createdAt]
      properties:
        lat:
          type: number
        lng:
          type: number
        doorKnockResult:
          type: string
          nullable: true
        contactOutcome:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    PipelineFunnelEnvelope:
      type: object
      required: [pipeline, stages, activeTotal, terminalTotal]
      description: >-
        Stage-level lead counts for one pipeline. Terminal stages are present
        in the stages array; activeTotal excludes them, terminalTotal sums them.
      properties:
        pipeline:
          type: string
          description: The pipeline that was queried.
        stages:
          type: array
          description: All stages for this pipeline, sorted by order ascending.
          items:
            $ref: "#/components/schemas/PipelineFunnelStage"
        activeTotal:
          type: integer
          description: Sum of counts for non-terminal stages.
        terminalTotal:
          type: integer
          description: Sum of counts for terminal stages.

    PipelineFunnelStage:
      type: object
      required: [key, label, order, count, isTerminal]
      properties:
        key:
          type: string
        label:
          type: string
        order:
          type: integer
        count:
          type: integer
        isTerminal:
          type: boolean

