              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /selections/product-options/{id}:
    delete:
      tags: [Selections]
      operationId: deleteSelectionProductOption
      summary: Remove a product–option mapping (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mapping removed.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ── Contract Builder (authenticated) ──────────────────────────────────────

  /pins/{pinId}/inspection-estimate:
    get:
      tags: [Contracts]
      operationId: getPinInspectionEstimate
      summary: Latest inspection estimate total for prefilling covered scope
      parameters:
        - { name: pinId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Estimate summary; coveredScopeCents is null when no estimate exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionEstimateForContractEnvelope"
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Lead not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /pins/{pinId}/contracts:
    get:
      tags: [Contracts]
      operationId: listPinContracts
      summary: List all contracts for a lead
      parameters:
        - { name: pinId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Contract list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractListEnvelope"
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Lead not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    post:
      tags: [Contracts]
      operationId: createContract
      summary: Create a draft contract for a lead
      parameters:
        - { name: pinId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractInput"
      responses:
        "201":
          description: Contract created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "400":
          description: Invalid input.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "409":
          description: A live contract already exists for this lead.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /contracts/{contractId}:
    get:
      tags: [Contracts]
      operationId: getContract
      summary: Get contract detail including scope packages and selections
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Contract detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Contract not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    patch:
      tags: [Contracts]
      operationId: updateContract
      summary: Update draft/sent contract fields (signed contracts are immutable)
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContractInput"
      responses:
        "200":
          description: Contract updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "400":
          description: Invalid input.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Contract not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "409":
          description: Signed or voided contracts are immutable.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /contracts/{contractId}/scope-packages:
    post:
      tags: [Contracts]
      operationId: addContractScopePackage
      summary: Add a scope package to a draft/sent contract
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractScopePackageInput"
      responses:
        "201":
          description: Scope package added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractScopePackageEnvelope"
        "400":
          description: Invalid input or category not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Contract not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "409":
          description: Signed or voided contracts are immutable.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /contracts/{contractId}/scope-packages/{pkgId}:
    patch:
      tags: [Contracts]
      operationId: updateContractScopePackage
      summary: Update a scope package (draft/sent only)
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string } }
        - { name: pkgId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContractScopePackageInput"
      responses:
        "200":
          description: Package updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractScopePackageEnvelope"
        "400":
          description: Invalid input.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Contract or package not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "409":
          description: Signed or voided contracts are immutable.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    delete:
      tags: [Contracts]
      operationId: deleteContractScopePackage
      summary: Remove a scope package from a draft contract
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string } }
        - { name: pkgId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Package removed.
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Contract or package not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "409":
          description: Only draft contracts allow package removal.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /contracts/{contractId}/send:
    post:
      tags: [Contracts]
      operationId: sendContract
      summary: Transition contract from draft to sent; activates the access code
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Contract sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Contract not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "409":
          description: Contract is not in draft status.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422":
          description: No scope packages on this contract.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /contracts/{contractId}/generate-document:
    post:
      tags: [Contracts]
      operationId: generateContractDocument
      summary: Generate (or regenerate) the contract PDF and store it
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Document generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Contract not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "409":
          description: Signed or voided contracts cannot be regenerated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /contracts/{contractId}/void:
    post:
      tags: [Contracts]
      operationId: voidContract
      summary: Void a contract (manager+ only, reason required)
      parameters:
        - { name: contractId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidContractInput"
      responses:
        "200":
          description: Contract voided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "400":
          description: Missing or empty voidReason.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "401":
          description: Not authenticated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "403":
          description: Manager or above required.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Contract not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "409":
          description: Contract is already voided.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  # ── Contract Signing Portal (public, access-code gated) ────────────────────

  /portal/contract/{code}:
    get:
      tags: [ContractPortal]
      operationId: getPortalContract
      summary: Load contract details by access code (customer-facing)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Contract detail with packages and available products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalContractEnvelope"
        "404":
          description: Contract not found or not available.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "410":
          description: Contract has been voided; link is no longer active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalVoidedResponse"
        "429":
          description: Rate limited.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /portal/contract/{code}/select/{pkgId}:
    post:
      tags: [ContractPortal]
      operationId: portalSelectProduct
      summary: Record a product selection for a scope package
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: pkgId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalSelectProductInput"
      responses:
        "200":
          description: Selection recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSelectionEnvelope"
        "400":
          description: Invalid product or option.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Contract or package not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limited.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /portal/contract/{code}/document:
    get:
      tags: [ContractPortal]
      operationId: getPortalContractDocument
      summary: Stream the generated contract PDF
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: PDF bytes.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Contract or document not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limited.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /portal/contract/{code}/generate-document:
    post:
      tags: [ContractPortal]
      operationId: portalGenerateContractDocument
      summary: Generate the contract PDF from the customer portal (requires all packages selected)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Document generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalGenerateDocumentResponse"
        "404":
          description: Contract not found.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limited.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }

  /portal/contract/{code}/sign:
    post:
      tags: [ContractPortal]
      operationId: portalSignContract
      summary: Submit customer signature (requires all packages selected and document generated)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalSignInput"
      responses:
        "200":
          description: Contract signed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSignResponse"
        "400":
          description: Invalid input.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "404":
          description: Contract not found or not available.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "422":
          description: Missing selections or no document generated.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
        "429":
          description: Rate limited.
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }


components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    ParsedSlope:
      type: object
      required: [label]
      properties:
        label:
          type: string
        areaSqft:
          type: [number, "null"]
        pitchRise:
          type: [integer, "null"]
        pitchRun:
          type: [integer, "null"]
        materialType:
          type: [string, "null"]

    ParsedSidingFacet:
      type: object
      required: [label]
      properties:
        label:
          type: string
        areaSqft:
          type: [number, "null"]

    MeasurementsAnalysisResult:
      type: object
      required: [parsed]
      properties:
        parsed:
          type: object
          required: [slopes, linears, totals, accessories, sidingFacets, confidence]
          properties:
            slopes:
              type: array
              items:
                $ref: "#/components/schemas/ParsedSlope"
            linears:
              type: object
              additionalProperties:
                type: [number, "null"]
            totals:
              type: object
              additionalProperties:
                type: [number, "null"]
            accessories:
              type: object
              additionalProperties:
                type: [number, "null"]
            sidingFacets:
              type: array
              items:
                $ref: "#/components/schemas/ParsedSidingFacet"
            confidence:
              type: string
              enum: [high, medium, low]
            notes:
              type: [string, "null"]

    ApplyMeasurementsInput:
      type: object
      properties:
        slopes:
          type: array
          items:
            $ref: "#/components/schemas/ParsedSlope"
        linears:
          type: object
          additionalProperties:
            type: [number, "null"]
        totals:
          type: object
          additionalProperties:
            type: [number, "null"]
        accessories:
          type: object
          additionalProperties:
            type: [number, "null"]
        sidingFacets:
          type: array
          items:
            $ref: "#/components/schemas/ParsedSidingFacet"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, companyId]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
        companyId:
          type: string
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    CompanyEnvelope:
      type: object
      required: [company]
      properties:
        company:
          $ref: "#/components/schemas/Company"
    FipsaSettings:
      type: object
      required: [contractorLegalName, contractorAddress, fipsaFeeCents]
      properties:
        contractorLegalName:
          type: [string, "null"]
        contractorAddress:
          type: [string, "null"]
        fipsaFeeCents:
          type: [number, "null"]
          description: Documentation Fee in cents (e.g. 75000 = $750.00).

    FipsaSettingsEnvelope:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: "#/components/schemas/FipsaSettings"

    UpdateFipsaSettingsInput:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: "#/components/schemas/FipsaSettings"

    ReportBranding:
      type: object
      description: Forensic-report color palette. All values are strict #RRGGBB hex.
      required: [headerColor, headerTextColor, accentColor]
      properties:
        headerColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        headerTextColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    ReportBrandingEnvelope:
      type: object
      required: [branding]
      properties:
        branding:
          oneOf:
            - $ref: "#/components/schemas/ReportBranding"
            - type: "null"
    UpdateReportBrandingInput:
      type: object
      required: [branding]
      properties:
        branding:
          oneOf:
            - $ref: "#/components/schemas/ReportBranding"
            - type: "null"
          description: Pass null to reset to the default palette.
    UpdateReportBrandingResult:
      type: object
      required: [ok, branding]
      properties:
        ok:
          type: boolean
        branding:
          oneOf:
            - $ref: "#/components/schemas/ReportBranding"
            - type: "null"
    ContractorLicense:
      type: object
      required: [state, number, classification]
      properties:
        state:
          type: string
          minLength: 2
          maxLength: 2
        number:
          type: string
          minLength: 1
          maxLength: 60
        classification:
          type: string
          minLength: 1
          maxLength: 120
    CompanyReportSettings:
      type: object
      required: [licenses, qualificationsText, pricingBasisStatement]
      properties:
        licenses:
          type: array
          items:
            $ref: "#/components/schemas/ContractorLicense"
        qualificationsText:
          type: [string, "null"]
          maxLength: 4000
        pricingBasisStatement:
          type: [string, "null"]
          maxLength: 2000
    CompanyReportSettingsEnvelope:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: "#/components/schemas/CompanyReportSettings"
    UpdateCompanyReportSettingsInput:
      type: object
      required: [settings]
      properties:
        settings:
          $ref: "#/components/schemas/CompanyReportSettings"
    OpeningStatement:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          maxLength: 300
          description: Applicable code book title in effect (opening statement heading).
        body:
          type: string
          maxLength: 4000
          description: Statement text printed under the title.
    CodeCitation:
      type: object
      required: [key, element, title, cite, body]
      properties:
        key:
          type: string
          maxLength: 60
        element:
          type: string
          maxLength: 60
        title:
          type: string
          maxLength: 200
        cite:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 2000
    JurisdictionPack:
      type: object
      required:
        [id, jurisdiction, state, openingStatements, uppaLaw, uppaStatement,
         generalCodeCitations, roofingCodeCitations, sidingCodeCitations]
      properties:
        id:
          type: string
        jurisdiction:
          type: string
          maxLength: 120
          description: Free-form jurisdiction name, e.g. "Dallas County, TX".
        state:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-letter state code used to match a property to packs.
        openingStatements:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OpeningStatement"
        uppaLaw:
          type: [string, "null"]
          maxLength: 300
          description: UPPA law / governing statute reference.
        uppaStatement:
          type: [string, "null"]
          maxLength: 2000
          description: UPPA statement printed in the Proof Package.
        generalCodeCitations:
          type: array
          items:
            $ref: "#/components/schemas/CodeCitation"
        roofingCodeCitations:
          type: array
          items:
            $ref: "#/components/schemas/CodeCitation"
        sidingCodeCitations:
          type: array
          items:
            $ref: "#/components/schemas/CodeCitation"
    UpsertJurisdictionPackInput:
      type: object
      required: [pack]
      properties:
        pack:
          type: object
          required:
            [jurisdiction, state, openingStatements, uppaLaw, uppaStatement,
             generalCodeCitations, roofingCodeCitations, sidingCodeCitations]
          properties:
            id:
              type: [string, "null"]
              description: Existing pack id to update; null/absent creates a new pack.
            jurisdiction:
              type: string
              minLength: 1
              maxLength: 120
            state:
              type: string
              minLength: 2
              maxLength: 2
            openingStatements:
