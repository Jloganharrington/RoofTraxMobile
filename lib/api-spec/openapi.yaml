    InspectionStatus:
      type: string
      enum: [scheduled, capturing, validating, submitted, package_ready]
    InspectionPhase:
      type: string
      description: >-
        Business phase of a single inspection record (P0). Begins as
        `preliminary` (light top-of-funnel capture) and advances IN PLACE to
        `forensic` at the P4 checkpoint — one record, never two.
      enum: [preliminary, forensic]
    PreliminaryPhotoRole:
      type: string
      description: >-
        A Phase 1 single-shot evidence slot (P2). Captured through the evidence
        module without a triad. `damage_closeup` is the legacy generic
        close-up (counted as a roof close-up); the `damage_closeup_*` roles
        are surface-tagged — at least one is required per damage surface
        selected in Phase 1.
      enum:
        [
          front_of_home,
          roof_overview,
          damage_closeup,
          damage_closeup_roof,
          damage_closeup_siding,
          damage_closeup_collateral,
          damage_closeup_interior,
        ]
    ElevationDirection:
      type: string
      enum: [front, right, back, left]
    InspectionSubjectType:
      type: string
      enum: [inspection, slope, elevation, damage_instance, test_square, test_square_hit, component, penetration, product, interior_observation, siding_facet]
    TestSquareHitType:
      type: string
      description: >-
        Controlled vocabulary (D1) for classifying an individual hit counted
        inside a test square. Raw classification only — no derived density or
        severity.
      enum: [hail_strike, mechanical, blistering, foot_scuff]
    PhotoTriadRole:
      type: string
      description: >-
        Photo capture role. The forensic triad is wide/mid/close;
        measurement and collateral are standalone roles (REPORT_DATA v2)
        that map 1:1 onto captureContext.
      enum: [wide, mid, close, measurement, collateral]
    PhotoCaptureContext:
      type: string
      description: >-
        REPORT_DATA v2 photos[].captureContext — derived server-side from
        triadRole/preliminaryRole, never stored.
      enum: [overview, mid-range, close-up, measurement, collateral]
    CaptureStage:
      type: string
      description: Protocol v2 step key. S-numbers are retired.
      enum:
        [
          arrival,
          property_profile,
          elevation_access,
          facets,
          test_squares,
          components,
          product,
          siding,
          collateral,
          interior,
          repairability,
          mitigation,
          homeowner,
          existing_conditions,
          declaration,
          summary,
          estimate,
          submit,
        ]
    FacetDamageType:
      type: string
      description: >-
        Per-facet damage classification. hail / hail_and_wind facets drive
        the Step-4 test-square gate.
      enum: [hail, wind, hail_and_wind, none]
    SidingDamageType:
      type: string
      description: >-
        v2.1 — per-siding-facet damage classification (distinct vocabulary
        from roof facets).
      enum: [wind, hail, tree]
    SidingPhotoRole:
      type: string
      description: >-
        v2.1 — which role a siding-facet photo plays (damage close-up, whole-
        facet shot, or one declared component's photo). Set only on
        subjectType 'siding_facet' photos.
      enum: [damage, facet, component]
    AttestationType:
      type: string
      enum: [equipment, gps_override, stage_signoff]
    InteriorObservationType:
      type: string
      description: >-
        Controlled vocabulary (E2) for a single interior/attic observation.
        Raw facts only — no derived severity or causation.
      enum: [ceiling_stain, wall_stain, moisture_reading, attic_pass, other]

    StormConfirmedRef:
      type: object
      description: >-
        The inspector-confirmed storm of record (B5). Raw snapshot of the
        single severe-weather event selected as cause of loss.
      required:
        [date, type, hailSize, windSpeed, distance, description, queriedLocation, dateOfLoss, confirmedAtUtc]
      properties:
        date:
          type: string
        type:
          type: string
          enum: [hail, wind, tornado]
        hailSize:
          type: [number, "null"]
        windSpeed:
          type: [number, "null"]
        distance:
          type: [number, "null"]
        description:
          type: [string, "null"]
        queriedLocation:
          type: string
        dateOfLoss:
          type: [string, "null"]
        confirmedAtUtc:
          type: string
        # Local time of day (HH:MM, 24h) of the confirmed event. Optional so
        # storms confirmed before this field existed keep parsing.
        time:
          type: [string, "null"]
    ArrivalConditions:
      type: object
      description: >-
        Arrival-conditions log captured in Step 1 · Arrival Log (protocol
        v2 — windCondition replaces wind; personnelPresent is an array).
      required:
        [
          sky,
          windCondition,
          temp,
          personnelPresent,
          timeLocal,
          gpsLatitude,
          gpsLongitude,
          recordedAtUtc,
        ]
      properties:
        sky:
          type: [string, "null"]
        windCondition:
          type: [string, "null"]
        temp:
          type: [string, "null"]
        personnelPresent:
          type: array
          items:
            type: string
        timeLocal:
          type: [string, "null"]
        gpsLatitude:
          type: [number, "null"]
        gpsLongitude:
          type: [number, "null"]
        recordedAtUtc:
          type: string
    HomeownerFacts:
      type: object
      description: >-
        Structured homeowner facts (E3). Plain factual intake only — no
        coverage, settlement, or advice language ever appears here.
      required: [awareOfDateOfLoss, priorRepairs, priorClaims, recordedAtUtc]
      properties:
        awareOfDateOfLoss:
          type: [boolean, "null"]
        priorRepairs:
          type: [string, "null"]
        priorClaims:
          type: [string, "null"]
        recordedAtUtc:
          type: string
    GateFinding:
      type: object
      description: A single gate-engine finding (deficiency or soft flag).
      required: [stage, code, message]
      properties:
        stage:
          type: string
        code:
          type: string
        message:
          type: string
    SubmissionPhotoHash:
      type: object
      required: [photoId, sha256]
      properties:
        photoId:
          type: string
        sha256:
          type: string
        # Component-zone tag (additive, v2 Components step). Lets the Brain
        # group shared zone photos without re-fetching photo rows.
        zone:
          oneOf:
            - $ref: "#/components/schemas/ComponentZone"
            - type: "null"
    SubmissionManifestV1:
      type: object
      description: >-
        Client-assembled submission contract v1 (E6) — the stable interface the
        Brain inherits. A manifest of record ids by type, per-photo SHA-256
        hashes, the protocol version the gate ran under, and the gate results.
        Assembled and hashed client-side; the server accepts it thin. M-F adds
        server-side hash verification, record locking, and a pre-flight endpoint.
      required: [protocolVersion, generatedAtUtc, records, photoHashes, gateResults]
      properties:
        protocolVersion:
          type: string
        generatedAtUtc:
          type: string
        records:
          type: object
          description: Map of record type to the list of record ids included in the package.
          additionalProperties:
            type: array
            items:
              type: string
        photoHashes:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionPhotoHash"
        gateResults:
          type: object
          required: [deficiencies, softFlags]
          properties:
            deficiencies:
              type: array
              items:
                $ref: "#/components/schemas/GateFinding"
            softFlags:
              type: array
              items:
                $ref: "#/components/schemas/GateFinding"
        # Signature-on-file reference (M-F / F0). The client copies the
        # inspector's on-file signature (URL + SHA-256) into the manifest at
        # submit time so the package carries a durable, self-contained proof of
        # who signed. Optional in the contract for backwards compatibility, but
        # the server rejects a submission whose inspector has no signature on
        # file, so a real submission always carries it.
        signatureOnFile:
          oneOf:
            - $ref: "#/components/schemas/SignatureOnFileRef"
            - type: "null"
        # Tie-in protocol summary — which facets each cut protocol applies
        # to. The Brain keys the fixed tie-in exhibit off these lists.
        tieInProtocols:
          type: object
          required: [valley, hipRidge]
          properties:
            valley:
              type: array
              items:
                $ref: "#/components/schemas/TieInFacetRef"
            hipRidge:
              type: array
              items:
                $ref: "#/components/schemas/TieInFacetRef"
    TieInFacetRef:
      type: object
      required: [slopeId, label]
      properties:
        slopeId:
          type: string
        label:
          type: string
    SignatureOnFileRef:
      type: object
      required: [url, sha256]
      properties:
        url:
          type: string
        sha256:
          type: string
        signedAt:
          type: [string, "null"]
          format: date-time

    Inspection:
      type: object
      required:
        [
          id,
          companyId,
          pinId,
          inspectorUserId,
          status,
          phase,
          damageType,
          preliminaryCompletedAt,
          claimNumber,
          policyNumber,
          carrierName,
          insuredName,
          address,
          latitude,
          longitude,
          notes,
          dateOfLoss,
          stormConfirmedRef,
          arrivalConditions,
          homeownerFacts,
          submissionManifest,
          lockedAt,
          roofDamageFound,
          sidingDamageFound,
          collateralDamageFound,
          interiorDamageFound,
          sidingMeasurementReportRef,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        companyId:
          type: string
        pinId:
          type: [string, "null"]
        inspectorUserId:
          type: string
        status:
          $ref: "#/components/schemas/InspectionStatus"
        phase:
          $ref: "#/components/schemas/InspectionPhase"
        damageType:
          type: [string, "null"]
          description: Phase 1 light damage type (P2). Null for forensic-first records.
        preliminaryCompletedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Set at the P4 checkpoint when Phase 1 is marked complete (resume
            later) or as provenance when advancing to forensic.
        claimNumber:
          type: [string, "null"]
        policyNumber:
          type: [string, "null"]
        carrierName:
          type: [string, "null"]
        insuredName:
          type: [string, "null"]
        ownerEmail:
          type: [string, "null"]
          description: >-
            Homeowner contact email captured at scheduling time. Used for
            appointment notifications and Phase 2 comms.
        address:
          type: [string, "null"]
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        notes:
          type: [string, "null"]
        dateOfLoss:
          type: [string, "null"]
        scheduledFor:
          type: [string, "null"]
          format: date-time
          description: Rep-chosen date for the Phase 2 forensic inspection. Null until booked.
        stormConfirmedRef:
          oneOf:
            - $ref: "#/components/schemas/StormConfirmedRef"
            - type: "null"
        arrivalConditions:
          oneOf:
            - $ref: "#/components/schemas/ArrivalConditions"
            - type: "null"
        homeownerFacts:
          oneOf:
            - $ref: "#/components/schemas/HomeownerFacts"
            - type: "null"
        submissionManifest:
          oneOf:
            - $ref: "#/components/schemas/SubmissionManifestV1"
            - type: "null"
        lockedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Set at submission verification (M-F / F2); non-null means the record
            is locked and immutable — corrections must be filed as addenda.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        slopes:
          type: array
          description: >-
            Child slopes. Populated by GET /inspections/{id} (detail view);
            omitted from the list feed. Optional so list rows and the mobile
            optimistic cache stay valid.
          items:
            $ref: "#/components/schemas/InspectionSlope"
        elevations:
          type: array
          description: Child elevations, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionElevation"
        damageInstances:
          type: array
          description: Child damage instances, populated by the detail view only.
          items:
            $ref: "#/components/schemas/DamageInstance"
        photos:
          type: array
          description: Captured evidence photos, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionPhoto"
        components:
          type: array
          description: C4 documented existing-components, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionComponent"
        penetrations:
          type: array
          description: C4 roof penetration inventory, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionPenetration"
        products:
          type: array
          description: C5 product-identification records, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionProduct"
        testSquares:
          type: array
          description: M-D (S4) test squares, populated by the detail view only.
          items:
            $ref: "#/components/schemas/TestSquare"
        testSquareHits:
          type: array
          description: >-
            M-D (S4) test-square hits across every square on this inspection,
            populated by the detail view only. Grouped client-side by
            testSquareId to drive the live hit counter.
          items:
            $ref: "#/components/schemas/TestSquareHit"
        attestations:
          type: array
          description: >-
            Attestations recorded on this inspection (equipment checklist,
            GPS override, stage sign-offs incl. the D2 inaccessible-slope
            attestation), populated by the detail view only.
          items:
            $ref: "#/components/schemas/Attestation"
        roofDamageFound:
          type: boolean
          description: v2.1 Elevation Walk flag — roof damage observed.
        sidingDamageFound:
          type: boolean
          description: v2.1 Elevation Walk flag — siding damage observed.
        collateralDamageFound:
          type: boolean
          description: v2.1 Elevation Walk flag — collateral damage observed.
        interiorDamageFound:
          type: boolean
          description: >-
            REPORT_DATA v2 — fourth damage-surface flag: interior is part of
            this claim. An explicit inspector decision, never derived from
            interior observations. Gates the Interior/Attic step.
        sidingWrbPresent:
          type: [boolean, "null"]
          description: >-
            v2.2 — Does the home currently have a water-resistive barrier?
            Asked once at the inspection level on the Siding Inspection step
            (shown when at least one siding facet has damage). Null until
            answered.
        sidingMeasurementReportRef:
          type: [string, "null"]
          description: >-
            v2.1 optional siding measurement report reference (client id of
            the uploaded report photo).
        # REPORT_DATA v2 capture blocks — null means "not captured" and the
        # corresponding report section omits.
        propertyProfile:
          oneOf:
            - $ref: "#/components/schemas/PropertyProfile"
            - type: "null"
        repairabilityAssessment:
          oneOf:
            - $ref: "#/components/schemas/RepairabilityAssessment"
            - type: "null"
        existingOrUnrelatedConditions:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ExistingCondition"
            - type: "null"
        temporaryRepairs:
          oneOf:
            - $ref: "#/components/schemas/TemporaryRepairs"
            - type: "null"
        propertyProtectionPlan:
          oneOf:
            - $ref: "#/components/schemas/PropertyProtectionPlan"
            - type: "null"
        damageSurfaceChangeLog:
          type: array
          description: >-
            Append-only audit trail of damage-surface flag removals made
            during the forensic phase (server-recorded; read-only).
          items:
            $ref: "#/components/schemas/DamageSurfaceChange"
        sidingFacets:
          type: array
          description: v2.1 siding facets, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionSidingFacet"
        interiorObservations:
          type: array
          description: E2 interior/attic observations, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InteriorObservation"
        measurements:
          type: array
          description: E1 (S7) raw measurements, populated by the detail view only.
          items:
            $ref: "#/components/schemas/Measurement"
        latestAgreement:
          description: >-
            The most recent active (non-voided) signed FIPSA agreement for this
            inspection. Null when no agreement has been signed yet. Populated
            by the detail view only.
          oneOf:
            - type: object
              required: [id, signedAt, signerName]
              properties:
                id:
                  type: string
                signedAt:
                  type: string
                  format: date-time
                signerName:
                  type: string
            - type: "null"
        estimate:
          description: >-
            Advisory contractor estimate saved at the Estimate step. Money in
            integer cents; line rows snapshot the price-book values at save
            time. Null until a rep saves one. Populated by the detail view only.
          oneOf:
            - type: object
              required: [wastePercent, measuredBasis, lines, subtotalCents, note, updatedAt]
              properties:
                wastePercent:
                  type: number
                  description: Waste factor applied to measured roof squares (10 = 10%).
                measuredBasis:
                  type: object
                  required: [roofAreaSqft, roofSquares, wasteAdjustedSquares, damagedSidingFacetCount]
                  properties:
                    roofAreaSqft:
                      type: [number, "null"]
                    roofSquares:
                      type: [number, "null"]
                    wasteAdjustedSquares:
                      type: [number, "null"]
                    damagedSidingFacetCount:
                      type: number
                lines:
                  type: array
                  items:
                    type: object
                    required: [priceBookItemId, description, unit, quantity, unitPriceCents, totalCents, isAdder]
                    properties:
                      priceBookItemId:
                        type: [string, "null"]
                      description:
                        type: string
                      unit:
                        type: [string, "null"]
                      quantity:
                        type: number
                      unitPriceCents:
                        type: integer
                      totalCents:
                        type: integer
                      isAdder:
                        type: boolean
                      evidenceLinks:
                        type: array
                        description: >-
                          Structured evidence links (photo/finding → this scope
                          line) with provenance and review state. Absent on
                          legacy lines. reviewedBy/reviewedAt are stamped
                          server-side; AI-suggested links are never treated as
                          verified unless approved.
                        items:
                          type: object
                          required: [targetType, targetId, linkSource, reviewStatus, reviewedBy, reviewedAt]
                          properties:
                            targetType:
                              type: string
                              enum: [photo, damage_instance]
                            targetId:
                              type: string
                            linkSource:
                              type: string
                              enum: [inspector, user, ai_suggested, imported]
                            reviewStatus:
                              type: string
                              enum: [unreviewed, approved, rejected]
                            reviewedBy:
                              type: [string, "null"]
                            reviewedAt:
                              type: [string, "null"]
                      linkedPhotoIds:
                        type: array
                        description: Server-derived photo ids from APPROVED links only.
                        items:
                          type: string
                      linkedDamageInstanceIds:
                        type: array
                        description: Server-derived damage-instance ids from APPROVED links only.
                        items:
                          type: string
                subtotalCents:
                  type: integer
                note:
                  type: [string, "null"]
                updatedAt:
                  type: string
                  format: date-time
            - type: "null"
        aiSummary:
          description: >-
            AI-generated forensic summary produced at the Summary step by
            Claude Sonnet. Null until the inspector triggers generation.
            Populated by the detail view only.
          oneOf:
            - type: object
              required: [forensicSummary, repairabilityText, generatedAt]
              properties:
                forensicSummary:
                  type: string
                  description: 3-5 paragraph forensic narrative of the inspection findings.
                repairabilityText:
                  type: string
                  description: >-
                    Repairability assessment narrative. Empty string when no
                    repairability data was captured.
                generatedAt:
                  type: string
                  format: date-time
                  description: ISO-8601 timestamp when this version was generated.
            - type: "null"
        compiledReportPath:
          type: [string, "null"]
          description: >-
            Object-storage path (`/objects/uploads/{uuid}`) of the Gemini-compiled
            HTML report. Null until the inspector triggers compilation via
            POST /inspections/{id}/report/compile. Populated by the detail view only.
        compiledReportReadyAt:
          type: [string, "null"]
          format: date-time
          description: >-
            ISO-8601 timestamp when the compiled report was last (re-)generated.
            Null when compiledReportPath is null.
