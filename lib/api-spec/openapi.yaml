          type: [string, "null"]
        sortOrder:
          type: integer
    SignChangeOrderInput:
      type: object
      description: >-
        Signs the change order. Either pdfBase64 (mobile path — server uploads
        the PDF to object storage) or documentObjectPath (CRM / pre-upload path)
        is required; the server returns 400 if neither is supplied.
        homeownerSignedAt and repSignedAt are always server-stamped (NOW()).
      properties:
        pdfBase64:
          type: string
          description: >-
            Base64-encoded PDF generated on-device. Server decodes, stores to
            object storage, and sets documentObjectPath automatically.
        sha256:
          type: string
          description: >-
            SHA-256 hex digest of the raw PDF bytes (used with pdfBase64).
        documentObjectPath:
          type: string
          minLength: 1
          description: Pre-uploaded object-storage path (CRM / direct-upload callers).
        documentSha256:
          type: string
          minLength: 1
        homeownerName:
          type: string
          description: Display name embedded in the audit record.
        repName:
          type: string
          description: Display name embedded in the audit record.
        homeownerSignaturePath:
          type: string
          description: >-
            Optional — legacy callers that upload separate signature images.
            The mobile flow embeds signatures inside the PDF.
        repSignaturePath:
          type: string
