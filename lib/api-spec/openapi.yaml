          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /activity-stats:
    get:
      tags: [Activity]
      operationId: getActivityStats
      summary: Company-scoped canvassing activity stats, rank, and leaderboard
      description: >-
        Field reps see only their own current-period metrics plus their
        rank. Managers and above may toggle scope and see a named
        leaderboard. All scoping and ranking is computed server-side over
        the canvassing cohort.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ActivityScope"
        - name: userId
          in: query
          required: false
          description: Target user for scope=individual (manager+ only).
          schema:
            type: string
      responses:
        "200":
          description: Activity stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityStatsEnvelope"
        "401":
