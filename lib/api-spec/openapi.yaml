    PropertyProfile:
      type: object
      description: >-
        REPORT_DATA v2 — field-captured property/construction description.
        Only non-derived fields; roofSlopeCount, roofCovering,
        interiorAreasInspected etc. are derived Brain-side.
      required: [recordedAtUtc]
      properties:
        propertyType:
          oneOf:
            - type: string
              enum: [single_family, townhome, condo, multi_family, commercial]
            - type: "null"
        stories:
          oneOf:
            - type: string
              enum: ["1", "1.5", "2", "2.5", "3+"]
            - type: "null"
        roofType:
          type: [string, "null"]
        roofAgeYears:
          type: [number, "null"]
        roofAgeBasis:
          description: Required whenever roofAgeYears is set — an unsourced age is attackable.
          oneOf:
            - type: string
              enum: [homeowner_reported, permit_record, product_date_code, estimated]
            - type: "null"
        accessibilityNotes:
          type: [string, "null"]
        buildingType:
          type: [string, "null"]
        attachedOrDetached:
          oneOf:
            - type: string
              enum: [attached, detached]
            - type: "null"
        roofGeometry:
          type: array
          items:
            type: string
            enum: [gable, hip, mansard, gambrel, flat, complex]
        deckType:
          oneOf:
            - type: string
              enum: [plywood, osb, plank, skip_sheathing, unknown]
            - type: "null"
        framingConditionNotes:
          type: [string, "null"]
        recordedAtUtc:
          type: string
    RapDamageFinding:
      type: object
      description: >-
        One collateral-damage question's finding in the Repair Attempt
        Protocol. `shingles` are the affected shingle numbers (3-8, within
        the manipulated count); `photoId` references the one example
        inspection_photos row for this category (never a URL).
      required: [answer, shingles]
      properties:
        answer:
          type: string
          enum: [yes, no]
        shingles:
          type: array
          items:
            type: number
        photoId:
          type: [string, "null"]
        note:
          type: [string, "null"]
    RepairAttemptProtocol:
      type: object
      description: >-
        Repair Attempt Protocol (RAP) record — asphalt-shingle roofs only.
        Shingle "X" is pulled, shingles 1-8 around it are manipulated, mat
        transfer is checked on 1-2, and five collateral-damage questions
        cover shingles 3-8. Photo fields reference inspection_photos row ids
        (client-generated for offline idempotency), never URLs.
      required: [matTransfer, damage]
      properties:
        manipulatedCount:
          description: >-
            How many shingles required manipulation to complete the protocol
            (6, 7, or 8). Null while unanswered; legacy records without it
            render the historical fixed count.
          oneOf:
            - type: number
              enum: [6, 7, 8]
            - type: "null"
        rap1PhotoId:
          type: [string, "null"]
        matTransfer:
          type: object
          required: [shingle1, shingle2]
          properties:
            shingle1:
              type: [string, "null"]
              enum: [yes, no, null]
            shingle2:
              type: [string, "null"]
              enum: [yes, no, null]
        damage:
          type: object
          description: >-
            Collateral-damage findings keyed by category (delamination,
            creasing, nailZone, puncture, reseat). Missing keys mean the
            question is unanswered.
          properties:
            delamination:
              $ref: "#/components/schemas/RapDamageFinding"
            creasing:
              $ref: "#/components/schemas/RapDamageFinding"
            nailZone:
              $ref: "#/components/schemas/RapDamageFinding"
            puncture:
              $ref: "#/components/schemas/RapDamageFinding"
            reseat:
              $ref: "#/components/schemas/RapDamageFinding"
    VapDamageFinding:
      type: object
      description: >-
        One collateral-damage question's finding in the Vinyl Assessment
        Protocol. `components` are the affected component labels (panels
        "1"-"4", trim "T1"-"T4"); `photoId` references the one example
        inspection_photos row for this category (never a URL).
      required: [answer, components]
      properties:
        answer:
          type: string
          enum: [yes, no]
        components:
          type: array
          items:
            type: string
        photoId:
          type: [string, "null"]
        note:
          type: [string, "null"]
    VinylAssessmentProtocol:
      type: object
      description: >-
        Vinyl Assessment Protocol (VAP) record — vinyl siding only. Panel
        "X" is removed and replaced, surrounding panels 1-4 and trim
        components T1+ are manipulated, and five collateral-damage questions
        cover the manipulated components. Photo fields reference
        inspection_photos row ids (client-generated for offline
        idempotency), never URLs.
      required: [damage]
      properties:
        panelsManipulated:
          description: >-
            How many panels (beyond X) were manipulated to complete the
            protocol (2-6). Null while unanswered.
          oneOf:
            - type: number
              enum: [2, 3, 4, 5, 6]
            - type: "null"
        trimManipulated:
          description: >-
            How many trim/interface components were manipulated (0-4).
            Null while unanswered.
          oneOf:
            - type: number
              enum: [0, 1, 2, 3, 4]
            - type: "null"
        vap1PhotoId:
          type: [string, "null"]
        finalPhotoId:
          description: Final annotated archive photo of the repaired zone.
          type: [string, "null"]
        damage:
          type: object
          description: >-
            Collateral-damage findings keyed by category (crackSplit,
            lockingEdge, nailHem, trimInterface, reseat). Missing keys mean
            the question is unanswered.
          properties:
            crackSplit:
              $ref: "#/components/schemas/VapDamageFinding"
            lockingEdge:
              $ref: "#/components/schemas/VapDamageFinding"
            nailHem:
              $ref: "#/components/schemas/VapDamageFinding"
            trimInterface:
              $ref: "#/components/schemas/VapDamageFinding"
            reseat:
              $ref: "#/components/schemas/VapDamageFinding"
    RepairabilitySystemFlow:
      type: object
      description: >-
        One system's (roof or siding) question-flow record. `answers` is keyed
        by question id (RR-xxx / SR-xxx); radio answers are single value keys,
        multi-selects are arrays of value keys. The determination is gated
        server-side by documented basis factors and evidence rules — the app
        can never output "full replacement required".
      required: [answers, determination, basisFactors, nextStep]
      properties:
        rap:
          description: >-
            Asphalt-shingle roof flows only: the Repair Attempt Protocol
            record. Absent on siding flows, non-asphalt roof flows, and
            pre-RAP records.
          oneOf:
            - $ref: "#/components/schemas/RepairAttemptProtocol"
            - type: "null"
        roofMaterial:
          type: [string, "null"]
          enum: [asphalt_shingle, cedar_shake, standing_seam_metal, null]
          description: >-
            Roof flows only: which roofing-material question flow was
            completed (asphalt RR-xxx, cedar shake CS-xxx, or standing seam
            SM-xxx). Legacy roof flows without this field are asphalt.
        productMatch:
          description: >-
            Set when RR-010 = catalog_match: the probable product match
            picked from the company's Known Product Catalog. Clients send
            only productId; name/photo/width/exposure are server-hydrated
            snapshots from the catalog at save time.
          oneOf:
            - type: "null"
            - type: object
              required: [productId]
              properties:
                productId:
                  type: string
                  minLength: 1
                name:
                  type: string
                photoPath:
                  type: [string, "null"]
                widthInches:
                  type: [number, "null"]
                exposureInches:
                  type: [number, "null"]
        answers:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        determination:
          type: string
          enum: [supported, conditionally_supported, not_supported, indeterminate]
        basisFactors:
          type: array
          items:
            type: string
        nextStep:
          type: string
          minLength: 1
        evidencePhotoIds:
          type: array
          items:
            type: string
        evidenceDocRefs:
          type: array
          items:
            type: string
        notes:
          type: [string, "null"]
    RepairabilityAssessmentV2Input:
      type: object
      description: >-
        Client-sent repairability assessment (v2 question flow).
        assessorName/assessorCredentials are IGNORED if sent — the server
        populates them from the inspector's profile. Must be explicitly
        performed; never defaulted. Each selected system requires its own
        completed flow; one system's evidence never populates the other's
        determination.
      required: [version, systems, recordedAtUtc]
      properties:
        version:
          type: number
          enum: [2]
        systems:
          type: array
          minItems: 1
          items:
            type: string
            enum: [roof, siding]
        roof:
          oneOf:
            - $ref: "#/components/schemas/RepairabilitySystemFlow"
            - type: "null"
        siding:
          oneOf:
            - $ref: "#/components/schemas/RepairabilitySystemFlow"
            - type: "null"
        recordedAtUtc:
          type: string
    RepairabilityAssessmentV3Input:
      type: object
      description: >-
        Client-sent repairability assessment (v3 — Repair Attempt Protocol
        flow, 2026-07-28 rebuilt screen). Gate question (warranted), assessed
        systems, roof type, and the RAP record. Partial protocol runs are
        savable — internal consistency is validated server-side, but
        unanswered questions are legal so field answers are never lost.
        assessorName/assessorCredentials are IGNORED if sent — the server
        populates them from the inspector's profile.
      required: [version, warranted, systems, recordedAtUtc]
      properties:
        version:
          type: number
          enum: [3]
        warranted:
          type: string
          enum: [yes, not_warranted_discontinued, not_authorized]
        systems:
          description: >-
            Systems the repairability assessment covers. Must be empty unless
            warranted is "yes".
          type: array
          items:
            type: string
            enum: [roof, siding]
        roofType:
          type: [string, "null"]
          enum: [asphalt_shingle, null]
        sidingType:
          description: >-
            Siding material — vinyl runs the Vinyl Assessment Protocol;
            aluminum routes to the Product ID-supported non-repairability
            determination (no simulated repair).
          type: [string, "null"]
          enum: [vinyl, aluminum, null]
        rap:
          oneOf:
            - $ref: "#/components/schemas/RepairAttemptProtocol"
            - type: "null"
        vap:
          oneOf:
            - $ref: "#/components/schemas/VinylAssessmentProtocol"
            - type: "null"
        recordedAtUtc:
          type: string
    RepairabilityAssessmentInput:
      oneOf:
        - $ref: "#/components/schemas/RepairabilityAssessmentV2Input"
        - $ref: "#/components/schemas/RepairabilityAssessmentV3Input"
    RepairabilityAssessmentV2:
      allOf:
        - $ref: "#/components/schemas/RepairabilityAssessmentV2Input"
        - type: object
          properties:
            assessorName:
              type: [string, "null"]
            assessorCredentials:
              type: [string, "null"]
    RepairabilityAssessmentV3:
      allOf:
        - $ref: "#/components/schemas/RepairabilityAssessmentV3Input"
        - type: object
          properties:
            assessorName:
              type: [string, "null"]
            assessorCredentials:
              type: [string, "null"]
    RepairabilityAssessment:
      oneOf:
