            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /canvassing/clock-in:
    post:
      tags: [Canvassing]
      operationId: clockInCanvassing
      summary: Start a canvassing session
      responses:
        "201":
          description: Session started.
          content:
            application/json:
