      summary: >-
        Compile the Gemini-generated forensic report for this inspection.
        Gated: assigned inspector or manager+. Allowed post-submission (allowLocked).
        Stores a JSON data blob (not a rendered HTML file) in object storage; photo URLs
        are resolved fresh at every preview request so the artifact never goes stale.
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report data compiled and stored.
          content:
            application/json:
              schema:
                type: object
                required: [compiledReportPath]
                properties:
                  compiledReportPath:
                    type: string
        "400":
          description: AI summary not yet generated — run the Summary step first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
