openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Profile
    description: Current user's role and workflow assignment.
  - name: Pins
    description: Field pin creation, listing, and bulk upload.
  - name: Admin
    description: Team management and overview stats (manager/admin only).
  - name: Location
    description: Live rep location tracking.
  - name: Geocode
    description: Coordinate/address lookups.
  - name: Canvassing
    description: Canvassing time tracking (clock in/out).
  - name: Activity
    description: Company-scoped canvassing activity stats, ranks, and leaderboards.
  - name: Weather
    description: Deterministic candidate storm events (VisualCrossing, no AI scoring).
  - name: Inspections
    description: >-
      Forensic insurance-inspection records and their child capture data
      (slopes, elevations, damage instances, test squares, photos,
      measurements, attestations). Thin CRUD only — validates, stamps the
      tenant, and stores raw values; no derived/computed logic. Gated by
      the inspection module permission (inspector_canvasser department or
      super_admin role).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
        - name: companyId
          in: query
          required: false
          description: Company ID chosen on the join/create-company screen. Only used the first time this user logs in; ignored on subsequent logins.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /companies:
    post:
      tags: [Companies]
      operationId: createCompany
      summary: Create a new company and generate its join ID
      description: Public — used on the "create a company" screen before the user has logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Company created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companies/{companyId}:
    get:
      tags: [Companies]
      operationId: getCompany
      summary: Look up a company by its join ID
      description: Public — used to confirm a company exists before joining it.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyEnvelope"
        "404":
          description: No company with that ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /profile/me:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: Get the current user's role and workflow assignment
      description: Creates a default profile (field_rep / insurance) on first access.
      responses:
        "200":
          description: Profile resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /pins:
    get:
      tags: [Pins]
      operationId: listPins
      summary: List pins visible to the current user
      description: >-
        Every role sees all pins. Field reps see other reps' pins as
        read-only context (rendered grey client-side). Managers/admins may
        pass `userId` to filter down to a single rep's pins.
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: Managers/admins only — filter to a single rep's pins.
      responses:
        "200":
          description: Pins list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinListEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Pins]
      operationId: createPin
      summary: Drop a new pin
      description: Server reverse-geocodes the coordinates into a display address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePinInput"
      responses:
        "201":
          description: Pin created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinEnvelope"
        "400":
          description: Invalid pin payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /pins/bulk:
    post:
      tags: [Pins]
      operationId: bulkCreatePins
      summary: Create multiple Roof pins from drone photos with embedded GPS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreatePinsInput"
      responses:
        "201":
          description: Pins created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinListEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /pins/{pinId}:
    patch:
      tags: [Pins]
      operationId: updatePin
      summary: Edit a pin
      description: Owners may edit their own pins; managers/admins may edit any pin.
      parameters:
        - name: pinId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePinInput"
      responses:
        "200":
          description: Pin updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinEnvelope"
        "400":
          description: Invalid pin payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not permitted to edit this pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Pin not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Pins]
      operationId: deletePin
      summary: Delete a pin
      description: Owners may delete their own pins; managers/admins may delete any pin.
      parameters:
        - name: pinId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pin deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSuccess"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not permitted to delete this pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Pin not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /admin/stats:
    get:
      tags: [Admin]
      operationId: getAdminStats
      summary: Get overview KPI stats
      description: Manager/admin only.
      responses:
        "200":
          description: Overview stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Manager/admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users:
    get:
      tags: [Admin]
      operationId: listTeamUsers
      summary: List all users with role, workflow assignment, and pin counts
      description: Manager/admin only.
      responses:
        "200":
          description: Team member list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamUserListEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Manager/admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/users/{userId}:
    patch:
      tags: [Admin]
      operationId: updateTeamUser
      summary: Update a team member's role and/or workflow assignment
      description: |
        Manager/admin only. Enforces role-hierarchy permission rules: nobody
        can modify their own role, managers cannot modify other managers or
        admins and cannot grant manager/admin, admins can manage everyone.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamUserInput"
      responses:
        "200":
          description: Updated team member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamUserEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not permitted to perform this update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Admin]
      operationId: removeTeamUser
      summary: Remove a team member
      description: Manager/admin only, subject to the same role-hierarchy rules as update.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSuccess"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not permitted to remove this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /location/ping:
    post:
      tags: [Location]
      operationId: pingLocation
      summary: Report the current user's latest GPS position
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationPingBody"
      responses:
        "200":
          description: Location stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationPingSuccess"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /geocode/reverse:
    get:
      tags: [Geocode]
      operationId: reverseGeocodeCoordinates
      summary: Look up a human-readable address for a coordinate pair
      description: Best-effort only; returns a null address if lookup fails.
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
        - name: longitude
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Lookup completed (address may be null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseGeocodeResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /geocode/search:
    get:
      tags: [Geocode]
      operationId: searchAddress
      summary: Look up coordinates for a specific address
      description: >-
        Forward geocoding, so a rep can find a specific address instead of
        only working off their current GPS position. Best-effort only;
        returns an empty list if nothing matches or the lookup fails.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Free-text address or place query.
      responses:
        "200":
          description: Matching candidates, best match first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressSearchResults"
        "400":
          description: Missing query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /location/team:
    get:
      tags: [Location]
      operationId: listTeamLocations
      summary: List the latest known location of every team member
      description: Manager/admin only.
      responses:
        "200":
          description: Team locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamLocationListEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Manager/admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /inspections:
    get:
      tags: [Inspections]
      operationId: listInspections
      summary: List inspections in the current user's company
      responses:
        "200":
          description: Inspections list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionListEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Inspection module not enabled for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Inspections]
      operationId: createInspection
      summary: Create an inspection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInspectionInput"
      responses:
        "201":
          description: Inspection created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Inspection module not enabled for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /inspections/{inspectionId}:
    get:
      tags: [Inspections]
      operationId: getInspection
      summary: Get a single inspection
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inspection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Inspection module not enabled for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Inspection not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Inspections]
      operationId: updateInspection
      summary: Update an inspection's status or claim details
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInspectionInput"
      responses:
        "200":
          description: Inspection updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Inspection module not enabled for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Inspection not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /inspections/{inspectionId}/slopes:
    post:
      tags: [Inspections]
      operationId: createInspectionSlope
      summary: Add a roof slope to an inspection
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInspectionSlopeInput"
      responses:
        "201":
          description: Slope created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionSlopeEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Inspection module not enabled for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Inspection not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /inspections/{inspectionId}/elevations:
    post:
      tags: [Inspections]
      operationId: createInspectionElevation
      summary: Add a building elevation to an inspection
      parameters:
        - name: inspectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInspectionElevationInput"
      responses:
        "201":
          description: Elevation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionElevationEnvelope"
