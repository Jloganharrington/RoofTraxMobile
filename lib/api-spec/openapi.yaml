      operationId: reverseGeocodeCoordinates
      summary: Look up a human-readable address for a coordinate pair
      description: Best-effort only; returns a null address if lookup fails.
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
        - name: longitude
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Lookup completed (address may be null).
          content:
            application/json:
              schema:
