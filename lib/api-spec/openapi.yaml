          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Version contains blocked content and cannot be shared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many attempts from this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /dashboard/manifest:
    get:
      tags: [Dashboard]
      operationId: getDashboardManifest
      summary: Returns the ordered list of widgets this user is permitted to see
      description: >-
        Resolves the caller's role, department, and workflow server-side from
        their profile row and returns the filtered, ordered widget manifest.
        Returns metadata only (key, title, size). Widget payload data is never
        included here — each widget fetches its own data independently.
        Role/department/workflow are never read from the request; client-supplied
        values are silently ignored.
      responses:
        "200":
          description: Widget manifest for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardManifestEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /dashboard/layout:
    get:
      tags: [Dashboard]
      operationId: getDashboardLayout
      summary: Returns all granted widgets with current visibility and order state
      description: >-
        Returns the complete capability-resolved widget set for this user,
        annotated with each widget's current hidden state from the stored layout.
        Unlike GET /dashboard/manifest (which only returns visible widgets),
        this endpoint always returns every granted widget so settings UIs can
        toggle individual widgets back on without a full layout reset.
        Role/department/workflow are always resolved server-side.
      responses:
        "200":
          description: Full widget set with visibility state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLayoutEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Dashboard]
      operationId: patchDashboardLayout
      summary: Save the authenticated user's widget visibility and order preferences
      description: >-
        Persists a layout object against the authenticated user's profile.
        Hidden keys subtract from the capability-resolved set; order sorts it.
        A layout key that was not granted by the capability resolver can never
        reach the manifest response — this endpoint only stores preferences,
        the manifest route enforces security.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardLayoutInput"
      responses:
        "204":
          description: Layout saved successfully.
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [Dashboard]
      operationId: deleteDashboardLayout
      summary: Restore the authenticated user's widget layout to defaults
      description: >-
        Nulls the dashboard_layout column on the user's profile row, causing
        GET /dashboard/manifest to return the full capability-resolved set in
        catalog order.
      responses:
        "204":
          description: Layout reset to defaults.
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /dashboard/widgets/action_required:
    get:
      tags: [Dashboard]
      operationId: getActionRequiredWidget
      summary: Returns ranked items that require a manager's attention
      description: >-
        Company-scoped ranked list of leads and inspections that are stuck:
        overdue loop stages, stalled non-loop stages, blocked claims, and pins
        needing stage review. Capped at 25 items; the total count before capping
        is always returned. Requires the action_required widget capability
        (manager role or higher). A field_rep receives 403.
      responses:
        "200":
          description: Ranked action-required items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRequiredEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller does not have the action_required widget capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

