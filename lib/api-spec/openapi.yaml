openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Profile
    description: Current user's role and workflow assignment.
  - name: Pins
    description: Field pin creation, listing, and bulk upload.
  - name: Admin
    description: Team management and overview stats (manager/admin only).
  - name: Location
    description: Live rep location tracking.
  - name: Geocode
    description: Coordinate/address lookups.
  - name: Canvassing
    description: Canvassing time tracking (clock in/out).
  - name: Activity
    description: Company-scoped canvassing activity stats, ranks, and leaderboards.
  - name: Weather
    description: Deterministic candidate storm events (VisualCrossing, no AI scoring).
  - name: Inspections
    description: >-
      Forensic insurance-inspection records and their child capture data
      (slopes, elevations, damage instances, test squares, photos,
      measurements, attestations). Thin CRUD only — validates, stamps the
      tenant, and stores raw values; no derived/computed logic. Gated by
      the inspection module permission (inspector_canvasser department or
      super_admin role).
  - name: Portal
    description: >-
      Public Evidence Portal — no-account access for contractors and adjusters
      via an inspection's unique share code. Exposes inspection photos and
      Proof Package versions only; agreement/FIPSA content is never served.
  - name: PriceBook
    description: Company price book items for estimate line-item lookup.
  - name: Selections
    description: >-
      Selections Library — internal catalog of categories, brands, products
      (tiers), and colour options. Admin-only for writes; any authenticated
      company member may read.
  - name: Contracts
    description: >-
      Contract Builder — authenticated rep-facing endpoints for creating and
      managing roofing contracts, scope packages, and sending contracts to
      customers for signing.
  - name: ContractPortal
    description: >-
      Contract Signing Portal — public endpoints gated by access code only.
      Customers use these to view contract details, make product selections,
      and sign their contract.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
        - name: companyId
          in: query
          required: false
          description: Company ID chosen on the join/create-company screen. Only used the first time this user logs in; ignored on subsequent logins.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /companies:
    post:
      tags: [Companies]
      operationId: createCompany
      summary: Create a new company and generate its join ID
      description: Public — used on the "create a company" screen before the user has logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Company created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companies/{companyId}:
    get:
      tags: [Companies]
      operationId: getCompany
      summary: Look up a company by its join ID
      description: Public — used to confirm a company exists before joining it.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyEnvelope"
        "404":
          description: No company with that ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companies/{companyId}/fipsa-settings:
    get:
      tags: [Companies]
      operationId: getCompanyFipsaSettings
      summary: Get the company's FIPSA agreement settings
      description: >-
        Super admin only. Null fields mean not configured — the agreement
        template falls back to blank lines and the default $750.00 fee.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current FIPSA settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FipsaSettingsEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a super admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Company not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Companies]
      operationId: updateCompanyFipsaSettings
      summary: Update the company's FIPSA agreement settings
      description: >-
        Super admin only. Sets the contractor legal name, contractor address,
        and Documentation Fee (in cents) printed on generated FIPSA
        agreements. Pass null for a field to clear it.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFipsaSettingsInput"
      responses:
        "200":
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FipsaSettingsEnvelope"
        "400":
          description: Invalid values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a super admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Company not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companies/{companyId}/report-settings:
    get:
      tags: [Companies]
      operationId: getCompanyReportSettings
      summary: Get the company's Proof Package settings
      description: >-
        Super admin only. Contractor licenses, Statement of Qualifications,
        and pricing-basis statement printed in the Proof Package.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current report settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyReportSettingsEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a super admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Company not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Companies]
      operationId: updateCompanyReportSettings
      summary: Update the company's Proof Package settings
      description: Super admin only.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyReportSettingsInput"
      responses:
        "200":
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyReportSettingsEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a super admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companies/{companyId}/jurisdiction-packs:
    get:
      tags: [Companies]
      operationId: listCompanyJurisdictionPacks
      summary: List the company's Building Regulation Jurisdiction Packs
      description: Super admin only.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All jurisdiction packs for the company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JurisdictionPackListEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a super admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companies/{companyId}/jurisdiction-packs/{state}/code-research:
    post:
      tags: [Companies]
      operationId: researchJurisdictionCodes
      summary: >-
        AI code-research wizard. Uses Gemini to research building codes that
        apply to storm-damage roof/siding replacement in the given state and
        returns suggested code citations for the contractor to confirm.
        Nothing is saved — the client adds confirmed suggestions to the
        jurisdiction pack via the upsert endpoint. Super admin only.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeResearchInput"
      responses:
        "200":
          description: Suggested citations (unsaved).
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/CodeCitation"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a super admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: AI research failed — retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companies/{companyId}/jurisdiction-packs/upsert:
    put:
      tags: [Companies]
      operationId: upsertCompanyJurisdictionPack
      summary: Create or update a Building Regulation Jurisdiction Pack
      description: >-
        Super admin only. Packs are identified by a free-form jurisdiction
        name (unique per company) plus a two-letter state code used to match
        properties at compile time. The pack carries the Proof Package
        opening statement titles, the UPPA law and statement, and the
        general / roofing / siding code citations printed in the package.
        Include `pack.id` to update an existing pack; omit it to create one.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertJurisdictionPackInput"
      responses:
        "200":
          description: Pack stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JurisdictionPackEnvelope"
        "400":
          description: Invalid payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a super admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companies/{companyId}/jurisdiction-packs/{packId}:
    delete:
      tags: [Companies]
      operationId: deleteCompanyJurisdictionPack
      summary: Delete a Building Regulation Jurisdiction Pack
      description: Super admin only.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: packId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pack deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a super admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Pack not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companies/{companyId}/report-branding:
    get:
      tags: [Companies]
      operationId: getCompanyReportBranding
      summary: Get the company's forensic-report color palette
      description: >-
        Super admin only. A null `branding` means the default palette is in use.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current report branding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportBrandingEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a super admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Company not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [Companies]
      operationId: updateCompanyReportBranding
      summary: Set or clear the company's forensic-report color palette
      description: >-
        Super admin only. Pass `branding: null` to reset to the default
        palette. All colors must be strict `#RRGGBB` hex — they are embedded
        into rendered report HTML.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportBrandingInput"
      responses:
        "200":
          description: Palette updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateReportBrandingResult"
        "400":
          description: Invalid color values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not a super admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /companies/{companyId}/templates:
    get:
      tags: [Companies]
      operationId: listCompanyTemplates
      summary: List all document templates for a company
      description: >-
        Admin or super admin of the target company only.
        Returns all registered templates regardless of use case.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Template list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateListEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not an admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [Companies]
      operationId: createCompanyTemplate
      summary: Register a new document template
      description: >-
        Admin or super admin only. The object must already be in storage (use
        the storage upload endpoint first). MIME type is validated against the
        allowlist; content is sniffed against the declared type; files over
        20 MB are rejected. HTML is sanitized in-place before the row is
        inserted. Returns 409 when a non-'other' use case is already taken,
        with the current holder in the response body.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateInput"
      responses:
        "201":
          description: Template created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateEnvelope"
        "400":
          description: Validation error (missing fields, bad MIME type, content sniff failure, oversize).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not an admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: use_case slot is already occupied by another template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateConflictEnvelope"
  /companies/{companyId}/templates/{templateId}:
    patch:
      tags: [Companies]
      operationId: updateCompanyTemplate
      summary: Update a template's name, use case, or file
      description: >-
        Admin or super admin only. All fields are optional; at least one must
        be supplied. Replacing objectPath triggers the same MIME allowlist,
        size cap, and content-sniff checks as POST. The old storage object
        and its ownership row are deleted after the DB update succeeds.
        Returns 409 when the new use case is already taken.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateInput"
      responses:
        "200":
          description: Template updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateEnvelope"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not an admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Template not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: use_case slot is already occupied by another template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateConflictEnvelope"
    delete:
      tags: [Companies]
      operationId: deleteCompanyTemplate
      summary: Delete a template and its storage object
      description: >-
        Admin or super admin only. Deletes the DB row, the storage object,
        and the object ownership row. Storage deletion failures are logged
        but do not affect the HTTP response.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Template deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDeleteResult"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not an admin of this company.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Template not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
