      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingInspectionItem"
        total:
          type: integer
        capped:
          type: boolean
        scopedToSelf:
          type: boolean
          description: True when the caller is a field_rep seeing only their own.

