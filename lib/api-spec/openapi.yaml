  /weather/events:
    get:
      tags: [Weather]
      operationId: getWeatherEvents
      summary: Deterministic candidate storm events for a location and date of loss
      description: >-
        Extracted VisualCrossing retrieval + gating logic (no AI scoring).
        Returns qualifying severe-weather candidates. Gated by the
        inspection module permission.
      parameters:
        - name: location
          in: query
          required: true
          description: Property location — "lat,long" or a city/address string.
          schema:
            type: string
        - name: dateOfLoss
          in: query
          required: false
          description: Claimed date of loss (YYYY-MM-DD); prioritizes candidates near it.
          schema:
            type: string
      responses:
        "200":
          description: Candidate storm events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherCandidatesEnvelope"
        "400":
          description: Invalid query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Inspection module not enabled for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Weather provider error or not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, companyId]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
        companyId:
          type: string
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    CompanyEnvelope:
      type: object
      required: [company]
      properties:
        company:
          $ref: "#/components/schemas/Company"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
        companyId:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

    Role:
      type: string
      enum: [field_rep, manager, admin, super_admin]
    WorkflowAssignment:
      type: string
      enum: [retail, insurance_retail]
    Department:
      type: string
      enum: [canvasser, inspector_canvasser]
    PinWorkflow:
      type: string
      enum: [retail, insurance]
    DamageType:
      type: string
      enum: [roof, siding, roof_and_siding]
    DoorKnockResult:
      type: string
      enum: [no_answer, no_appointment, appointment]
    ContactOutcome:
      type: string
      enum: [no_soliciting, priority_inspection, call_to_schedule]

    Profile:
      type: object
      required: [userId, role, workflowAssignment, department, companyId, companyName]
      properties:
        userId:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        workflowAssignment:
          $ref: "#/components/schemas/WorkflowAssignment"
        department:
          $ref: "#/components/schemas/Department"
        companyId:
          type: string
        companyName:
          type: string
    ProfileEnvelope:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"

    RetailData:
      type: object
      required:
        [
          ownerName1,
          interestedRoof,
          interestedSiding,
          interestedWindows,
          interestedDoors,
        ]
      properties:
        ownerName1:
          type: string
          minLength: 1
        ownerName2:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        email:
          type: [string, "null"]
        interestedRoof:
          type: boolean
        interestedSiding:
          type: boolean
        interestedWindows:
          type: boolean
        interestedDoors:
          type: boolean
        interestNotes:
          type: [string, "null"]
        appointmentDate:
          type: [string, "null"]
        notes:
          type: [string, "null"]

    Pin:
      type: object
      required:
        [
          id,
          userId,
          latitude,
          longitude,
          address,
          workflow,
          damageType,
          photoUrl,
          doorKnockResult,
          retailData,
          contactOutcome,
          customerName,
          customerPhone,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        userId:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        address:
          type: [string, "null"]
        workflow:
          $ref: "#/components/schemas/PinWorkflow"
        damageType:
          oneOf:
            - $ref: "#/components/schemas/DamageType"
            - type: "null"
        photoUrl:
          type: [string, "null"]
        doorKnockResult:
          oneOf:
            - $ref: "#/components/schemas/DoorKnockResult"
            - type: "null"
        retailData:
          oneOf:
            - $ref: "#/components/schemas/RetailData"
            - type: "null"
        contactOutcome:
          oneOf:
            - $ref: "#/components/schemas/ContactOutcome"
            - type: "null"
        customerName:
          type: [string, "null"]
        customerPhone:
          type: [string, "null"]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PinEnvelope:
      type: object
      required: [pin]
      properties:
        pin:
          $ref: "#/components/schemas/Pin"
    PinListEnvelope:
      type: object
      required: [pins]
      properties:
        pins:
          type: array
          items:
            $ref: "#/components/schemas/Pin"

    CreatePinInput:
      type: object
      required: [latitude, longitude, workflow]
      properties:
        latitude:
          type: number
        longitude:
          type: number
        workflow:
          $ref: "#/components/schemas/PinWorkflow"
        damageType:
          $ref: "#/components/schemas/DamageType"
        photoUrl:
          type: string
        doorKnockResult:
          $ref: "#/components/schemas/DoorKnockResult"
        retailData:
          $ref: "#/components/schemas/RetailData"
        contactOutcome:
          $ref: "#/components/schemas/ContactOutcome"
        customerName:
          type: string
        customerPhone:
          type: string

    UpdatePinInput:
      type: object
      description: >-
        All fields optional; only the ones present are changed. Location
        (latitude/longitude) is immutable after creation.
      properties:
        workflow:
