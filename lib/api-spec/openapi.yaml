    Profile:
      type: object
      required:
        [
          userId,
          role,
          workflowAssignment,
          department,
          companyId,
          companyName,
          signatureUrl,
          signatureSha256,
          signatureSignedAt,
        ]
      properties:
        userId:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        workflowAssignment:
          $ref: "#/components/schemas/WorkflowAssignment"
        department:
          $ref: "#/components/schemas/Department"
        companyId:
          type: string
        companyName:
          type: string
        # Signature-on-file (M-F / F0). Null until the inspector captures a
        # signature on their profile. The URL points at the tenant-scoped
        # object-storage copy; the SHA-256 is an integrity proof of the exact
        # bytes; signedAt is when it was captured.
        signatureUrl:
          type: [string, "null"]
        signatureSha256:
          type: [string, "null"]
        signatureSignedAt:
          type: [string, "null"]
          format: date-time
        # Outbound SMTP settings (server-side report emailing). The password
        # is write-only: it is never returned. smtpConfigured indicates a
        # complete, usable configuration exists.
        smtpConfigured:
          type: boolean
        smtpHost:
          type: [string, "null"]
        smtpPort:
          type: [number, "null"]
        smtpSecure:
          type: [boolean, "null"]
        smtpUsername:
          type: [string, "null"]
        smtpFromEmail:
          type: [string, "null"]
        # Beta instrument gate (company-level): whether the in-app bug-report
        # button renders. Exposed on the profile so the mobile client needs no
        # separate settings fetch.
        betaBugReporting:
          type: boolean
        # REPORT_DATA v2 — individual credential layer (feeds
        # assessorCredentials and the submission payload).
        certifications:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/InspectorCertification"
            - type: "null"
        yearsExperience:
          type: [number, "null"]
        # Company logo URL (authenticated storage path). Read from the companies
        # row so the profile fetch is the only call needed.
        companyLogoUrl:
          type: [string, "null"]
        # FIPSA agreement settings (company-level, multi-tenant agreement).
        # Surfaced on the profile so the agreement screen needs no extra fetch.
        # Null = not configured; the template falls back to blank lines and
        # the $750.00 default fee.
        contractorLegalName:
          type: [string, "null"]
        contractorAddress:
          type: [string, "null"]
        fipsaFeeCents:
          type: [number, "null"]
        # Wave-2B personal profile fields (from users + user_profiles tables)
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        email:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        theme:
          type: string
          enum: [light, dark, system]
