          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller does not have the required pipeline widget capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

