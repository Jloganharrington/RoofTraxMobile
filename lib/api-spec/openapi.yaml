    InspectionStatus:
      type: string
      enum: [scheduled, capturing, validating, submitted, package_ready]
    InspectionPhase:
      type: string
      description: >-
        Business phase of a single inspection record (P0). Begins as
        `preliminary` (light top-of-funnel capture) and advances IN PLACE to
        `forensic` at the P4 checkpoint — one record, never two.
      enum: [preliminary, forensic]
    PreliminaryPhotoRole:
      type: string
      description: >-
        A Phase 1 single-shot evidence slot (P2). Captured through the evidence
        module without a triad. `damage_closeup` is the legacy generic
        close-up (counted as a roof close-up); the `damage_closeup_*` roles
        are surface-tagged — at least one is required per damage surface
        selected in Phase 1.
      enum:
        [
          front_of_home,
          roof_overview,
          damage_closeup,
          damage_closeup_roof,
          damage_closeup_siding,
          damage_closeup_collateral,
        ]
    ElevationDirection:
      type: string
      enum: [front, right, back, left]
    InspectionSubjectType:
      type: string
      enum: [inspection, slope, elevation, damage_instance, test_square, test_square_hit, component, penetration, product, interior_observation, siding_facet]
    TestSquareHitType:
      type: string
      description: >-
        Controlled vocabulary (D1) for classifying an individual hit counted
        inside a test square. Raw classification only — no derived density or
        severity.
      enum: [hail_strike, mechanical, blistering, foot_scuff]
    PhotoTriadRole:
      type: string
      enum: [wide, mid, close]
    CaptureStage:
      type: string
      description: Protocol v2 step key. S-numbers are retired.
      enum:
        [
          arrival,
          elevation_access,
          facets,
          test_squares,
          components,
          product,
          siding,
          collateral,
          interior,
          homeowner,
          declaration,
          submit,
        ]
    FacetDamageType:
      type: string
      description: >-
        Per-facet damage classification. hail / hail_and_wind facets drive
        the Step-4 test-square gate.
      enum: [hail, wind, hail_and_wind, none]
    SidingDamageType:
      type: string
      description: >-
        v2.1 — per-siding-facet damage classification (distinct vocabulary
        from roof facets).
      enum: [wind, hail, tree]
    SidingPhotoRole:
      type: string
      description: >-
        v2.1 — which role a siding-facet photo plays (damage close-up, whole-
        facet shot, or one declared component's photo). Set only on
        subjectType 'siding_facet' photos.
      enum: [damage, facet, component]
    AttestationType:
      type: string
      enum: [equipment, gps_override, stage_signoff]
    InteriorObservationType:
      type: string
      description: >-
        Controlled vocabulary (E2) for a single interior/attic observation.
        Raw facts only — no derived severity or causation.
      enum: [ceiling_stain, wall_stain, moisture_reading, attic_pass, other]

    StormConfirmedRef:
      type: object
      description: >-
        The inspector-confirmed storm of record (B5). Raw snapshot of the
        single severe-weather event selected as cause of loss.
      required:
        [date, type, hailSize, windSpeed, distance, description, queriedLocation, dateOfLoss, confirmedAtUtc]
      properties:
        date:
          type: string
        type:
          type: string
          enum: [hail, wind, tornado]
        hailSize:
          type: [number, "null"]
        windSpeed:
          type: [number, "null"]
        distance:
          type: [number, "null"]
        description:
          type: [string, "null"]
        queriedLocation:
          type: string
        dateOfLoss:
          type: [string, "null"]
        confirmedAtUtc:
          type: string
        # Local time of day (HH:MM, 24h) of the confirmed event. Optional so
        # storms confirmed before this field existed keep parsing.
        time:
          type: [string, "null"]
    ArrivalConditions:
      type: object
      description: >-
        Arrival-conditions log captured in Step 1 · Arrival Log (protocol
        v2 — windCondition replaces wind; personnelPresent is an array).
      required:
        [
          sky,
          windCondition,
          temp,
          personnelPresent,
          timeLocal,
          gpsLatitude,
          gpsLongitude,
          recordedAtUtc,
        ]
      properties:
        sky:
          type: [string, "null"]
        windCondition:
          type: [string, "null"]
        temp:
          type: [string, "null"]
        personnelPresent:
          type: array
          items:
            type: string
        timeLocal:
          type: [string, "null"]
        gpsLatitude:
          type: [number, "null"]
        gpsLongitude:
          type: [number, "null"]
        recordedAtUtc:
          type: string
    HomeownerFacts:
      type: object
      description: >-
        Structured homeowner facts (E3). Plain factual intake only — no
        coverage, settlement, or advice language ever appears here.
      required: [awareOfDateOfLoss, priorRepairs, priorClaims, recordedAtUtc]
      properties:
        awareOfDateOfLoss:
          type: [boolean, "null"]
        priorRepairs:
          type: [string, "null"]
        priorClaims:
          type: [string, "null"]
        recordedAtUtc:
          type: string
    GateFinding:
      type: object
      description: A single gate-engine finding (deficiency or soft flag).
      required: [stage, code, message]
      properties:
        stage:
          type: string
        code:
          type: string
        message:
          type: string
    SubmissionPhotoHash:
      type: object
      required: [photoId, sha256]
      properties:
        photoId:
          type: string
        sha256:
          type: string
        # Component-zone tag (additive, v2 Components step). Lets the Brain
        # group shared zone photos without re-fetching photo rows.
        zone:
          oneOf:
            - $ref: "#/components/schemas/ComponentZone"
            - type: "null"
    SubmissionManifestV1:
      type: object
      description: >-
        Client-assembled submission contract v1 (E6) — the stable interface the
        Brain inherits. A manifest of record ids by type, per-photo SHA-256
        hashes, the protocol version the gate ran under, and the gate results.
        Assembled and hashed client-side; the server accepts it thin. M-F adds
        server-side hash verification, record locking, and a pre-flight endpoint.
      required: [protocolVersion, generatedAtUtc, records, photoHashes, gateResults]
      properties:
        protocolVersion:
          type: string
        generatedAtUtc:
          type: string
        records:
          type: object
          description: Map of record type to the list of record ids included in the package.
          additionalProperties:
            type: array
            items:
              type: string
        photoHashes:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionPhotoHash"
        gateResults:
          type: object
          required: [deficiencies, softFlags]
          properties:
            deficiencies:
              type: array
              items:
                $ref: "#/components/schemas/GateFinding"
            softFlags:
              type: array
              items:
                $ref: "#/components/schemas/GateFinding"
        # Signature-on-file reference (M-F / F0). The client copies the
        # inspector's on-file signature (URL + SHA-256) into the manifest at
        # submit time so the package carries a durable, self-contained proof of
        # who signed. Optional in the contract for backwards compatibility, but
        # the server rejects a submission whose inspector has no signature on
        # file, so a real submission always carries it.
        signatureOnFile:
          oneOf:
            - $ref: "#/components/schemas/SignatureOnFileRef"
            - type: "null"
        # Tie-in protocol summary — which facets each cut protocol applies
        # to. The Brain keys the fixed tie-in exhibit off these lists.
        tieInProtocols:
          type: object
          required: [valley, hipRidge]
          properties:
            valley:
              type: array
              items:
                $ref: "#/components/schemas/TieInFacetRef"
            hipRidge:
              type: array
              items:
                $ref: "#/components/schemas/TieInFacetRef"
    TieInFacetRef:
      type: object
      required: [slopeId, label]
      properties:
        slopeId:
          type: string
        label:
          type: string
    SignatureOnFileRef:
      type: object
      required: [url, sha256]
      properties:
        url:
          type: string
        sha256:
          type: string
        signedAt:
          type: [string, "null"]
          format: date-time

    Inspection:
      type: object
      required:
        [
          id,
          companyId,
          pinId,
          inspectorUserId,
          status,
          phase,
          damageType,
          preliminaryCompletedAt,
          claimNumber,
          policyNumber,
          carrierName,
          insuredName,
          address,
          latitude,
          longitude,
          notes,
          dateOfLoss,
          stormConfirmedRef,
          arrivalConditions,
          homeownerFacts,
          submissionManifest,
          lockedAt,
          roofDamageFound,
          sidingDamageFound,
          collateralDamageFound,
          sidingMeasurementReportRef,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        companyId:
          type: string
        pinId:
          type: [string, "null"]
        inspectorUserId:
          type: string
        status:
          $ref: "#/components/schemas/InspectionStatus"
        phase:
          $ref: "#/components/schemas/InspectionPhase"
        damageType:
          type: [string, "null"]
          description: Phase 1 light damage type (P2). Null for forensic-first records.
        preliminaryCompletedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Set at the P4 checkpoint when Phase 1 is marked complete (resume
            later) or as provenance when advancing to forensic.
        claimNumber:
          type: [string, "null"]
        policyNumber:
          type: [string, "null"]
        carrierName:
          type: [string, "null"]
        insuredName:
          type: [string, "null"]
        address:
          type: [string, "null"]
        latitude:
          type: [number, "null"]
        longitude:
          type: [number, "null"]
        notes:
          type: [string, "null"]
        dateOfLoss:
          type: [string, "null"]
        stormConfirmedRef:
          oneOf:
            - $ref: "#/components/schemas/StormConfirmedRef"
            - type: "null"
        arrivalConditions:
          oneOf:
            - $ref: "#/components/schemas/ArrivalConditions"
            - type: "null"
        homeownerFacts:
          oneOf:
            - $ref: "#/components/schemas/HomeownerFacts"
            - type: "null"
        submissionManifest:
          oneOf:
            - $ref: "#/components/schemas/SubmissionManifestV1"
            - type: "null"
        lockedAt:
          type: [string, "null"]
          format: date-time
          description: >-
            Set at submission verification (M-F / F2); non-null means the record
            is locked and immutable — corrections must be filed as addenda.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        slopes:
          type: array
          description: >-
            Child slopes. Populated by GET /inspections/{id} (detail view);
            omitted from the list feed. Optional so list rows and the mobile
            optimistic cache stay valid.
          items:
            $ref: "#/components/schemas/InspectionSlope"
        elevations:
          type: array
          description: Child elevations, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionElevation"
        damageInstances:
          type: array
          description: Child damage instances, populated by the detail view only.
          items:
            $ref: "#/components/schemas/DamageInstance"
        photos:
          type: array
          description: Captured evidence photos, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionPhoto"
        components:
          type: array
          description: C4 documented existing-components, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionComponent"
        penetrations:
          type: array
          description: C4 roof penetration inventory, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionPenetration"
        products:
          type: array
          description: C5 product-identification records, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionProduct"
        testSquares:
          type: array
          description: M-D (S4) test squares, populated by the detail view only.
          items:
            $ref: "#/components/schemas/TestSquare"
        testSquareHits:
          type: array
          description: >-
            M-D (S4) test-square hits across every square on this inspection,
            populated by the detail view only. Grouped client-side by
            testSquareId to drive the live hit counter.
          items:
            $ref: "#/components/schemas/TestSquareHit"
        attestations:
          type: array
          description: >-
            Attestations recorded on this inspection (equipment checklist,
            GPS override, stage sign-offs incl. the D2 inaccessible-slope
            attestation), populated by the detail view only.
          items:
            $ref: "#/components/schemas/Attestation"
        roofDamageFound:
          type: boolean
          description: v2.1 Elevation Walk flag — roof damage observed.
        sidingDamageFound:
          type: boolean
          description: v2.1 Elevation Walk flag — siding damage observed.
        collateralDamageFound:
          type: boolean
          description: v2.1 Elevation Walk flag — collateral damage observed.
        sidingWrbPresent:
          type: [boolean, "null"]
          description: >-
            v2.2 — Does the home currently have a water-resistive barrier?
            Asked once at the inspection level on the Siding Inspection step
            (shown when at least one siding facet has damage). Null until
            answered.
        sidingMeasurementReportRef:
          type: [string, "null"]
          description: >-
            v2.1 optional siding measurement report reference (client id of
            the uploaded report photo).
        damageSurfaceChangeLog:
          type: array
          description: >-
            Append-only audit trail of damage-surface flag removals made
            during the forensic phase (server-recorded; read-only).
          items:
            $ref: "#/components/schemas/DamageSurfaceChange"
        sidingFacets:
          type: array
          description: v2.1 siding facets, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InspectionSidingFacet"
        interiorObservations:
          type: array
          description: E2 interior/attic observations, populated by the detail view only.
          items:
            $ref: "#/components/schemas/InteriorObservation"
        measurements:
          type: array
          description: E1 (S7) raw measurements, populated by the detail view only.
          items:
            $ref: "#/components/schemas/Measurement"
