  /geocode/search:
    get:
      tags: [Geocode]
      operationId: searchAddress
      summary: Look up coordinates for a specific address
      description: >-
        Forward geocoding, so a rep can find a specific address instead of
        only working off their current GPS position. Best-effort only;
        returns an empty list if nothing matches or the lookup fails.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Free-text address or place query.
        - name: latitude
          in: query
          required: false
          schema:
            type: number
          description: >-
            Optional latitude of the rep's current location. When provided
            with longitude, nearby results are boosted so a partial address
            surfaces local streets first instead of far-away zip/place matches.
        - name: longitude
          in: query
          required: false
          schema:
            type: number
          description: Optional longitude of the rep's current location.
      responses:
        "200":
          description: Matching candidates, best match first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressSearchResults"
        "400":
          description: Missing query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated.
          content:
            application/json:
